        p.flashAmount = 0.6; p.hitStop = 0.04;
      } else if (element === 'poison') {
        p.particleShape = 'teardrop'; p.gravity = -40; p.drag = 1;
        p.turbulence = 50; p.burstCount = 25; p.shakeAmount = 5;
      } else if (element === 'holy') {
        p.particleShape = 'sparkle'; p.gravity = -60; p.burstCount = 30;
        p.sizeStart = 25; p.speedMax = 250; p.flashAmount = 0.5;
      } else if (element === 'dark') {
        p.particleShape = 'crescent'; p.gravity = -20; p.orbit = 150;
        p.turbulence = 30; p.drag = 1;
      }
      break;
    }
    case 'projectile': {
      p.projectile = true; p.rate = 50; p.duration = 3;
      p.lifetimeMin = 0.15; p.lifetimeMax = 0.4;
      p.speedMin = 15; p.speedMax = 50; p.sizeStart = 20; p.sizeEnd = 5;
      p.drag = 3; p.gravity = 0; p.fadeOut = 0.3;
      p.projBodySize = parseFloat(document.getElementById('cpt-body').value) || 40;
      p.projBodyShape = ELEM_SHAPES[element] || 'circle';
      p.projBodyGlow = isAdditive;
      p.projImpact = ELEM_IMPACTS[element] || 'none';
      if (element === 'fire') { p.jitter = 12; p.turbulence = 20; p.rate = 60; }
      else if (element === 'lightning') { p.rate = 80; p.lifetimeMax = 0.15; p.stretch = 0.6; }
      else if (element === 'poison') { p.rate = 30; p.stretch = 0.5; }
      break;
    }
    case 'aura': {
      p.rate = 25; p.duration = 2; p.loop = true;
      p.lifetimeMin = 0.5; p.lifetimeMax = 1.2;
      p.shape = 'Disc'; p.shapeRadius = 45;
      p.speedMin = 10; p.speedMax = 35; p.sizeStart = 16; p.sizeEnd = 4;
      p.gravity = -30; p.drag = 1; p.orbit = 200;
      p.fadeIn = 0.1; p.fadeOut = 0.4;
      if (element === 'fire') { p.gravity = -50; p.turbulence = 25; p.jitter = 10; }
      else if (element === 'ice') { p.orbit = 100; p.gravity = -15; p.rotationRandom = 90; }
      else if (element === 'lightning') { p.rate = 15; p.jitter = 40; p.orbit = 300; }
      else if (element === 'poison') { p.gravity = 10; p.turbulence = 40; p.orbit = 80; }
      else if (element === 'holy') { p.gravity = -80; p.orbit = 150; p.rate = 30; }
      else if (element === 'dark') { p.orbit = 250; p.attract = 50; p.turbulence = 20; }
      break;
    }
    case 'trail': {
      p.rate = 45; p.duration = 1.5; p.loop = true;
      p.lifetimeMin = 0.2; p.lifetimeMax = 0.5;
      p.speedMin = 5; p.speedMax = 25; p.sizeStart = 20; p.sizeEnd = 3;
      p.drag = 4; p.fadeOut = 0.4; p.sizeRandom = 0.3;
      if (element === 'fire') { p.gravity = -30; p.jitter = 10; p.turbulence = 15; }
      else if (element === 'ice') { p.gravity = 20; p.drag = 2; }
      else if (element === 'lightning') { p.jitter = 30; p.lifetimeMax = 0.2; p.rate = 60; }
      else if (element === 'poison') { p.gravity = -15; p.turbulence = 25; }
      else if (element === 'holy') { p.gravity = -40; p.rate = 30; }
      else if (element === 'dark') { p.turbulence = 20; p.gravity = -10; p.orbit = 100; }
      break;
    }
    case 'ambient': {
      p.rate = 8; p.duration = 3; p.loop = true;
      p.lifetimeMin = 1.5; p.lifetimeMax = 3;
      p.shape = 'Box'; p.shapeBoxW = 350; p.shapeBoxH = 250;
      p.speedMin = 3; p.speedMax = 15; p.sizeStart = 10; p.sizeEnd = 3;
      p.gravity = -15; p.turbulence = 25; p.fadeIn = 0.15; p.fadeOut = 0.4;
      if (element === 'fire') {
        p.particleShape = 'flame'; p.gravity = -40; p.sizeStart = 14;
        p.rate = 12; p.turbulence = 35;
      } else if (element === 'ice') {
        p.particleShape = 'diamond'; p.gravity = 15; p.rotationRandom = 180;
        p.rotationSpeed = 30; p.turbulence = 15;
      } else if (element === 'lightning') {
        p.particleShape = 'spark'; p.rate = 5; p.lifetimeMax = 0.5;
        p.speedMax = 40; p.jitter = 20;
      } else if (element === 'poison') {
        p.particleShape = 'circle'; p.gravity = -10; p.turbulence = 40; p.rate = 6;
      } else if (element === 'holy') {
        p.particleShape = 'sparkle'; p.gravity = -25; p.rate = 6; p.sizeStart = 8;
      } else if (element === 'dark') {
        p.particleShape = 'crescent'; p.gravity = 5; p.turbulence = 20;
        p.orbit = 60; p.rate = 5;
      } else {
        p.particleShape = 'circle';
      }
      break;
    }
    case 'impact': {
      p.burstCount = 20; p.rate = 0; p.duration = 0.3;
      p.lifetimeMin = 0.1; p.lifetimeMax = 0.3;
      p.speedMin = 50; p.speedMax = 200; p.sizeStart = 20; p.sizeEnd = 3;
      p.drag = 5; p.gravity = 0;
      p.shakeAmount = 8; p.shakeDuration = 0.15;
      p.flashAmount = 0.2; p.flashDuration = 0.06; p.hitStop = 0.03;
      p.sizeCurve = 'easeOut'; p.fadeOut = 0.2;
      if (element === 'fire') { p.shakeAmount = 12; p.flashAmount = 0.35; }
      else if (element === 'lightning') { p.hitStop = 0.06; p.flashAmount = 0.5; p.speedMax = 400; }
      else if (element === 'earth') { p.gravity = 200; p.shakeAmount = 15; p.speedMax = 300; }
      break;
    }
    case 'heal': {
      p.rate = 20; p.duration = 1.5; p.loop = true;
      p.lifetimeMin = 0.5; p.lifetimeMax = 1.2;
      p.shape = 'Disc'; p.shapeRadius = 35;
      p.speedMin = 20; p.speedMax = 60; p.sizeStart = 14; p.sizeEnd = 3;
      p.gravity = -80; p.drag = 1; p.fadeIn = 0.15; p.fadeOut = 0.4;
      p.blendMode = 'Additive';
      if (!ELEM_COLORS[element]) p.colorKeys = [{r:0.3,g:1,b:0.5,a:1,t:0},{r:0.2,g:0.9,b:0.4,a:0.7,t:0.5},{r:0.1,g:0.7,b:0.3,a:0,t:1}];
      if (element === 'none') p.particleShape = 'cross';
      break;
    }
    case 'shield': {
      p.rate = 30; p.duration = 2; p.loop = true;
      p.lifetimeMin = 0.3; p.lifetimeMax = 0.8;
      p.shape = 'Circle'; p.shapeRadius = 60;
      p.speedMin = 3; p.speedMax = 10; p.sizeStart = 12; p.sizeEnd = 8;
      p.drag = 2; p.orbit = 300; p.gravity = 0;
      p.fadeIn = 0.1; p.fadeOut = 0.3;
      if (element === 'none') p.particleShape = 'shield';
      if (element === 'ice') { p.rotationRandom = 180; p.orbit = 200; }
      else if (element === 'earth') { p.sizeStart = 18; p.orbit = 150; p.speedMin = 1; }
      break;
    }
    case 'summon': {
      p.burstCount = 0; p.rate = 40; p.duration = 1;
      p.lifetimeMin = 0.3; p.lifetimeMax = 0.8;
      p.shape = 'Circle'; p.shapeRadius = 50;
      p.speedMin = 5; p.speedMax = 20; p.sizeStart = 18; p.sizeEnd = 5;
      p.attract = 300; p.orbit = 200; p.gravity = -40;
      p.fadeIn = 0.1; p.fadeOut = 0.3;
      p.flashAmount = 0.3; p.flashDuration = 0.15;
      if (element === 'dark') { p.orbit = 350; p.attract = 200; }
      else if (element === 'holy') { p.gravity = -100; p.attract = 150; }
      else if (element === 'lightning') { p.jitter = 30; p.rate = 60; }
      break;
    }
  }

  // ── 움직임 ──
  if (movement !== 'stay') {
    p.projectile = true;
    p.projSpeed = parseFloat(document.getElementById('cpt-speed').value) || 400;
    p.projDistance = parseFloat(document.getElementById('cpt-dist').value) || 350;
    p.projAngle = parseFloat(document.getElementById('cpt-angle').value) || 0;
    // 특수 움직임 매핑
    if (movement === 'fall') {
      p.projPath = 'linear'; p.projAngle = 120;
    } else if (movement === 'rise') {
      p.projPath = 'linear'; p.projAngle = -90;
    } else {
      p.projPath = movement;
    }
    if (movement === 'arc' || movement === 'fall') p.projArcHeight = 120;
    if (movement === 'wave' || movement === 'zigzag') { p.projWaveAmp = 35; p.projWaveFreq = 3; }
    if (!p.projBodySize) {
      p.projBodySize = parseFloat(document.getElementById('cpt-body').value) || 30;
      p.projBodyShape = ELEM_SHAPES[element] || 'circle';
      p.projBodyGlow = true;
    }
    const impact = document.getElementById('cpt-impact').value;
    if (impact && impact !== 'none') p.projImpact = impact;
    else if (!p.projImpact || p.projImpact === 'none') p.projImpact = ELEM_IMPACTS[element] || 'none';
  }

  // 적용
  extraSystems = [];
  mainSys.params = p;
  refreshPanel();
  restart();
  if (!playing) togglePlay();
}

async function callClaude(key, system, prompt, model, imageBase64) {
  // 이미지가 있으면 vision 입력으로 메시지 구성
  const content = imageBase64
    ? [
        { type: 'image', source: { type: 'base64', media_type: 'image/png', data: imageBase64 } },
        { type: 'text', text: prompt },
      ]
    : prompt;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model,
      max_tokens: 2048,
      system,
      messages: [{ role: 'user', content }],
    }),
  });
  if (!res.ok) throw new Error(`Claude API: ${res.status} — ${await res.text()}`);
  const data = await res.json();
  // content 배열에서 text 블록만 취함
  const textBlock = data.content.find(c => c.type === 'text');
  return textBlock ? textBlock.text : data.content[0].text;
}

// Gemini 사용 가능 모델 캐시 (키별)
const _geminiModelCache = {};

async function listGeminiModels(key) {
  if (_geminiModelCache[key]) return _geminiModelCache[key];
  const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`;
  const res = await fetch(url);
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`Gemini 모델 목록 조회 실패: ${res.status} — ${txt.slice(0, 200)}`);
  }
  const data = await res.json();
  const models = (data.models || [])
    .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''));
  console.log('[Gemini available models]', models);
  _geminiModelCache[key] = models;
  return models;
}

async function callGemini(key, system, prompt, _modelHint, imageBase64) {
  // 1. 사용 가능한 모델 목록 조회
  const available = await listGeminiModels(key);
  if (!available.length) {
    throw new Error('사용 가능한 Gemini 모델이 없습니다. API 키 권한을 확인하세요.');
  }
  // 2. 429 Quota 폴백: 우선순위대로 여러 모델 순차 시도
  const tryOrder = [];
  const primary = pickBestGeminiModel(available, !!imageBase64);
  tryOrder.push(primary);
  // 폴백: 다른 flash 계열들 (각각 독립 할당량)
  const fallbacks = ['gemini-1.5-flash-latest','gemini-1.5-flash','gemini-2.0-flash','gemini-2.5-flash','gemini-1.5-pro-latest','gemini-1.5-pro'];
  for (const fb of fallbacks) {
    const found = available.find(m => m === fb);
    if (found && !tryOrder.includes(found)) tryOrder.push(found);
  }

  let lastErr;
  for (const model of tryOrder) {
    console.log('[Gemini trying]', model, imageBase64 ? '(vision)' : '(text)');
    try {
      return await callGeminiOnce(key, system, prompt, model, imageBase64);
    } catch (e) {
      lastErr = e;
      console.warn('[Gemini fallback]', model, '->', e.message.slice(0, 100));
      // 429 (quota) 나 503 (overloaded) 만 다음 모델로 폴백
      if (!/\b(429|503)\b/.test(e.message)) throw e;
    }
  }
  throw lastErr || new Error('모든 Gemini 모델 할당량 초과 또는 과부하');
}

async function callGeminiOnce(key, system, prompt, model, imageBase64) {
  console.log('[Gemini selected model]', model, imageBase64 ? '(vision)' : '(text)');

  // 3. generateContent 호출
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
  const generationConfig = {
    temperature: 0.7,
    maxOutputTokens: 8192, // 2.5 flash 는 thinking 토큰도 포함하므로 넉넉하게
  };
  // 텍스트 전용일 때만 JSON 강제 모드 + thinkingConfig (vision 과 충돌 방지)
  if (!imageBase64) {
    generationConfig.responseMimeType = 'application/json';
    // Gemini 2.5 계열: 텍스트 생성에서만 thinking 끄기
    if (/^gemini-2\.5/.test(model)) {
      generationConfig.thinkingConfig = { thinkingBudget: 0 };
    }
  }
  // 이미지가 있으면 vision 입력으로 parts 구성 (이미지 먼저, 텍스트 나중)
  const parts = imageBase64
    ? [
        { inline_data: { mime_type: 'image/png', data: imageBase64 } },
        { text: prompt },
      ]
    : [{ text: prompt }];
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts }],
      generationConfig,
    }),
  });
  if (!res.ok) {
    const errTxt = await res.text();
    console.error('[Gemini full error]', errTxt);
    throw new Error(`Gemini ${model}: ${res.status} — ${errTxt.slice(0, 400)}`);
  }
  const data = await res.json();
  console.log('[Gemini raw response]', data);
  const candidate = data.candidates && data.candidates[0];
  if (!candidate) {
    throw new Error('Gemini: candidates 없음. 응답=' + JSON.stringify(data).slice(0, 300));
  }
  if (candidate.finishReason && candidate.finishReason !== 'STOP') {
    console.warn('[Gemini finishReason]', candidate.finishReason);
    if (candidate.finishReason === 'SAFETY') {
      throw new Error('Gemini SAFETY 차단 — 프롬프트를 순화해보세요');
    }
  }
  if (!candidate.content || !candidate.content.parts) {
    throw new Error('Gemini: content.parts 없음. finishReason=' + candidate.finishReason);
  }
  return candidate.content.parts.map(p => p.text || '').join('');
}

async function callOpenAI(key, system, prompt, model, imageBase64) {
  const userContent = imageBase64
    ? [
        { type: 'image_url', image_url: { url: `data:image/png;base64,${imageBase64}` } },
        { type: 'text', text: prompt },
      ]
    : prompt;
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key,
    },
    body: JSON.stringify({
      model,
      max_tokens: 2048,
      response_format: { type: 'json_object' },
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: userContent },
      ],
    }),
  });
  if (!res.ok) throw new Error(`OpenAI API: ${res.status} — ${await res.text()}`);
  const data = await res.json();
  return data.choices[0].message.content;
}

async function generateLLM() {
  const provider = getCurrentProvider();
  const info = LLM_PROVIDERS[provider];
  const key = document.getElementById('llm-key').value.trim();
  const prompt = document.getElementById('llm-prompt').value.trim();
  const status = document.getElementById('llm-status');
  if (!key || !prompt) { status.textContent = '키와 설명 필요'; return; }
  // 프로바이더 별로 키 저장
  sessionStorage.setItem(info.storageKey, key);
  sessionStorage.setItem('llm_last_provider', provider);
  _lastLLMPrompt = prompt; // refine 용으로 저장
  status.textContent = `${info.label} 생성 중...`;

  const system = getLLMSystemPrompt();
  await runLLMWithParams(provider, info, key, system, prompt, status, false);
}

function getLLMSystemPrompt() {
  return `당신은 2D 파티클 효과 디자이너입니다. 자연어 설명을 받아 아래 JSON 스키마에
정확히 맞춰 순수 JSON 객체 하나만 출력하세요 (마크다운, 설명, 주석 금지).

스키마 (단위: 픽셀, 초):
{
  "duration": float,                  // 효과 지속 시간
  "loop": bool,
  "rate": float,                      // 초당 방출 수
  "burstCount": int,                  // 시작 시 일제 방출
  "lifetimeMin": float, "lifetimeMax": float,
  "shape": "Point"|"Circle"|"Disc"|"Box"|"Cone",
  "shapeRadius": float,               // 원 반경(픽셀, Circle=테두리만 Disc=내부 균등)
  "shapeBoxW": float, "shapeBoxH": float,  // 박스 크기(픽셀)
  "coneAngle": float,                 // 0~90
  "speedMin": float, "speedMax": float,    // 픽셀/초, 보통 100~1000
  "directionX": float, "directionY": float, // 편향(픽셀/초), +Y=위
  "gravity": float,                   // 픽셀/초², 양수=아래
  "drag": float,                      // 0~20
  "sizeStart": float, "sizeEnd": float,    // 픽셀
  "sizeRandom": float (0~1),
  "rotationRandom": float (도),
  "rotationSpeed": float (도/초),
  "stretch": float (0~6, 속도 방향으로 길게 늘림. 베기/번개/빔/돌진은 3~5, 나머지는 0),
  "particleShape": "circle"|"square"|"diamond"|"triangle"|"star"|"teardrop"|"ring"|"cross"|"hexagon"|"spark"|"crescent"|"flame"|"pentagon"|"octagon"|"bar"|"pill"|"ellipse"|"bubble"|"heart"|"snowflake"|"bolt"|"shuriken"|"arrow"|"leaf"|"chevron"|"shield"|"sparkle",
  "pixelMode": bool (true 기본 — 픽셀 래스터화),
  "pixelScale": int (1~8, 블록 크기. 3 기본, 큰 청크 느낌은 4~6),
  "outlineWidth": float (0~4, 0이면 없음. 픽셀 아트는 0 또는 1),
  "sizeCurve": "linear"|"easeOut"|"easeIn"|"easeInOut"|"easeOutBack",
  "fadeIn": float (0~0.5, 수명 앞부분 소프트 페이드인 비율),
  "fadeOut": float (0~0.5, 수명 뒷부분 소프트 페이드아웃 비율),
  "burstSpread": float (0~0.3, burst 를 이 초만큼 분산 스폰 — 기계적 느낌 제거),
  "jitter": float (0~100, 속도 랜덤 요동 — 불꽃/영혼 같은 살아있는 느낌),
  "turbulence": float (0~200, 사인파 바람 — 연기/꽃잎 부드러운 흐름),
  "orbit": float (-2000~2000, 중심 주변 회전 접선력 — 소용돌이/토네이도는 300~1200),
  "attract": float (-2000~2000, 중심 흡인력 양수=빨림 음수=밀림 — 블랙홀은 200~800),
  "startColor": {"r":0~1,"g":0~1,"b":0~1,"a":0~1},
  "colorKeys": [{"r":0~1,"g":0~1,"b":0~1,"a":0~1,"t":0~1}, ...],
  "blendMode": "Alpha"|"Additive",
  "shakeAmount": float (0~50, 화면 흔들림 진폭),
  "flashAmount": float (0~1, 화면 플래시 강도),
  "hitStop": float (0~0.2, 시작 시 멈춤)
}

중요: 이 도구는 2D 픽셀 아트 스프라이트 게임 전용이다.
★ pixelMode=true 가 기본이다. 거의 항상 pixelMode=true 로 설정하라.
★ blendMode='Alpha' 가 거의 모든 경우의 정답. Additive 는 발광이 명확한 경우에만.
★ outlineWidth 는 0 또는 1 만 써라 (픽셀 아트는 외곽선 얇음).
★ sizeStart 는 작은 청크 단위 정수 (4, 6, 8, 10, 12, 16, 20, 24) 로 설정.
★ sizeRandom 은 0.3~0.5 가 자연스럽다.

★★ 캔버스 배경은 #050505 (거의 검정) 이다. 중요한 규칙:
- 순수 검정/매우 어두운 색 (RGB 0.0~0.15) 은 파티클 본체로 절대 사용 금지 → 화면에서 안 보임
- "검정색 X" 요청이 와도 실제로는 어두운 회색/보라/파랑 (RGB 0.3~0.5) 을 주고,
  하이라이트로 밝은 색 (0.7~1.0) 을 colorKeys 초반에 넣어 대비를 만들어라
- "어둠/그림자/검은" 테마는 짙은 보라(0.35,0.1,0.5) 또는 짙은 청색(0.15,0.1,0.4) + 밝은 테두리로 표현
- 색상 값의 평균이 0.35 이상이 되도록 유지 (너무 어두우면 안 보임)

파티클 모양 선택 가이드:
- 먼지·연기·폭발·화염·땅·핏방울·독구름 — circle (기본)
- 얼음·크리스탈·룬·꽃잎 — diamond
- 조각·파편·이빨 — triangle
- 코인·치유·반짝임·보석 획득 — star
- 영혼·눈물·물방울 — teardrop
- 충격파 원·포털·자기장 — ring (도넛)
- 치유·신성·마법·플러스 기호 — cross
- 크리스탈·SF 에너지·육각 패턴 — hexagon
- 빛 번쩍임·섬광·렌즈 플레어 — spark (4각별)
- 슬래시 호·초승달·달빛 — crescent
- 불꽃·불씨·화염 전용 — flame (비대칭 상승)

이미터 shape 선택:
- Point: 한 점에서 방사
- Circle: 원 둘레(테두리)에서 방출
- Disc: 원 내부 전체에 균등 분포 — 큰 플래시/클러스터에 필수
- Box: 사각형 내부
- Cone: 좁은 원뿔 방향 방출 (베기/분출)

베기/번개/빔/돌진처럼 "선 모양" 효과는 stretch 20~28 + Point 이미터 + 방향성 + burstCount 1~3.
큰 폭발 플래시는 Disc + burstCount 100~250 + 작은 sizeStart (8~14) 로 픽셀 클러스터 느낌.

★ 자연스러운 2D 애니메이션 가이드:
- 거의 모든 효과에 fadeIn 0.05~0.15 + fadeOut 0.2~0.3 을 줘서 팝 느낌 제거
- 크기 수축/확장에는 sizeCurve='easeOut' 이 기본, 임팩트 강조는 'easeOutBack'
- burst 가 있는 폭발/임팩트에는 burstSpread 0.03~0.08 로 살짝 분산 → 동시 스폰의 기계적 느낌 제거
- 연기/꽃잎/먼지 같은 환경 효과는 turbulence 20~60 으로 부드러운 흐름
- 불꽃/영혼/마법처럼 살아있는 것은 jitter 15~30 으로 미세 요동

async function runLLMWithParams(provider, info, key, system, prompt, status, isRefine, imageBase64) {
  try {
    let text;
    if (provider === 'claude') {
      text = await callClaude(key, system, prompt, info.model, imageBase64);
    } else if (provider === 'gemini') {
      text = await callGemini(key, system, prompt, info.model, imageBase64);
    } else if (provider === 'openai') {
      text = await callOpenAI(key, system, prompt, info.model, imageBase64);
    } else {
      throw new Error('알 수 없는 프로바이더: ' + provider);
    }
    const jsonStr = extractJson(text);
    if (!jsonStr) {
      console.error('[JSON 추출 실패] 원본 응답:', text);
      status.textContent = 'JSON 추출 실패 — F12 콘솔에서 원본 확인';
      return;
    }
    let obj;
    try {
      obj = JSON.parse(jsonStr);
    } catch (parseErr) {
      console.error('[JSON 파싱 실패]', parseErr, '\n원본:', jsonStr);
      status.textContent = 'JSON 파싱 실패 — F12 콘솔 확인';
      return;
    }
    pushUndo();
    extraSystems = [];
    const merged = Object.assign(defaultParams(), obj);
    sanitizeParams(merged);
    mainSys.params = merged;
    refreshPanel();
    restart();
    if (!playing) togglePlay();
    // refine 버튼 활성화
    const refineBtn = document.getElementById('llm-refine-btn');
    if (refineBtn) refineBtn.disabled = false;
    status.textContent = isRefine
      ? `✓ ${info.label} 비전 개선 완료`
      : `✓ ${info.label} 생성 완료 — 비전 개선 가능`;
  } catch (e) {
    status.textContent = humanizeLLMError(e, info.label);
    console.error('[LLM 호출 실패 전체]', e);
  }
}

// 에러 메시지를 사용자 친화 한국어로 변환
async function refineLLM() {
  const provider = getCurrentProvider();
  const info = LLM_PROVIDERS[provider];
  const key = document.getElementById('llm-key').value.trim();
  const status = document.getElementById('llm-status');
  if (!key) { status.textContent = '키 필요'; return; }
  if (!_lastLLMPrompt) { status.textContent = '먼저 [생성] 을 실행하세요'; return; }

  status.textContent = '렌더 캡처 중...';
  // 이펙트가 잘 보이는 시점에 캡처하기 위해 restart 후 잠시 기다림
  restart();
  await new Promise(r => setTimeout(r, 450));

  // 캔버스를 base64 PNG 로
  let base64;
  try {
    const dataUrl = canvas.toDataURL('image/png');
    base64 = dataUrl.replace(/^data:image\/png;base64,/, '');
  } catch (e) {
    status.textContent = '캔버스 캡처 실패';
    console.error(e);
    return;
  }

  // 개선 요청 프롬프트
  const currentParamsJson = JSON.stringify(mainSys.params);
  const refinePrompt =
`사용자의 원본 요청: "${_lastLLMPrompt}"

현재 파라미터 JSON:
${currentParamsJson}

위 첨부 이미지는 현재 파티클 시스템의 렌더 결과입니다. 캔버스는 800×600 검정 배경입니다.

이미지를 보고 다음을 평가하세요:
1. 파티클 크기가 화면 대비 적절한가? (너무 작거나 크지 않은가)
2. 색상이 사용자 요청과 맞는가?
3. 파티클 수/밀도가 적당한가?
4. 움직임 방향·속도·분포가 의도에 맞는가?
5. 특정 패턴 (소용돌이/베기/폭발/흡수 등) 이 요구되면 실제로 그렇게 보이는가?

문제가 있으면 수정된 파라미터 JSON 만 출력하세요.
이미 완벽하다면 현재 JSON 을 그대로 출력하세요.
JSON 이외의 설명·주석·마크다운 금지.`;

  sessionStorage.setItem(info.storageKey, key);
  status.textContent = `${info.label} 비전 분석 중...`;
  const system = getLLMSystemPrompt();
  await runLLMWithParams(provider, info, key, system, refinePrompt, status, true, base64);
}

window.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'KeyR') { e.preventDefault(); restart(); }
  else if (e.code === 'Period') { e.preventDefault(); stepFrame(); }
  else if (e.code === 'KeyB') { e.preventDefault(); cycleBg(); }
  else if (e.code === 'KeyG') { e.preventDefault(); toggleGrid(); }
});
