<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Sparklet — 2D 파티클 에디터</title>
<style>
  :root {
    --bg:#1e1e1e; --panel:#2b2b2b; --border:#3d3d3d;
    --text:#e0e0e0; --muted:#888; --accent:#4ea1ff;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    font-size:13px; display:flex; height:100vh; overflow:hidden;
  }
  #sidebar {
    width:340px; background:var(--panel);
    border-right:1px solid var(--border);
    overflow-y:auto; padding:10px;
  }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #canvas-wrap {
    flex:1; display:flex; align-items:center; justify-content:center;
    background:#050505; padding:10px;
  }
  canvas { background:#000; border:1px solid var(--border); }
  #canvas-wrap { position:relative; }
  #fps-overlay {
    position:absolute; top:16px; right:16px;
    background:rgba(0,0,0,0.6); color:#4ea1ff;
    padding:4px 10px; border-radius:4px;
    font-family:monospace; font-size:13px; font-weight:bold;
    pointer-events:none; user-select:none;
    border:1px solid rgba(78,161,255,0.3);
  }
  #fps-overlay .good { color:#4eff6a; }
  #fps-overlay .mid { color:#ffd14e; }
  #fps-overlay .bad { color:#ff6a4e; }
  #bottom {
    padding:10px; background:var(--panel);
    border-top:1px solid var(--border);
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  }
  h2 { margin:10px 0 4px; font-size:13px; color:var(--accent); }
  h3 { margin:10px 0 4px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  h3.group-header { cursor:pointer; user-select:none; display:flex; align-items:center; gap:4px; }
  h3.group-header::before { content:'▼'; font-size:9px; color:#666; transition:transform 0.15s; }
  h3.group-header.collapsed::before { content:'▶'; }
  .group-content { border-left:1px solid #333; padding-left:8px; margin-left:3px; margin-bottom:6px; }
  #preset-search, #combo-search {
    width:100%; margin:3px 0 6px; padding:4px 6px;
    background:#1a1a1a; color:var(--text);
    border:1px solid var(--border); font-size:11px;
  }
  .palette-swatch {
    display:inline-block; width:10px; height:10px;
    margin-right:2px; border:1px solid #000;
  }
  .copy-flash {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#2a5a8f; color:#fff; padding:8px 16px;
    font-size:12px; pointer-events:none; opacity:0;
    transition:opacity 0.2s;
  }
  .copy-flash.show { opacity:1; }
  input[type=number], input[type=text], input[type=password], select, textarea {
    background:#1a1a1a; color:var(--text);
    border:1px solid var(--border); padding:3px 5px;
    font-family:inherit; font-size:12px;
  }
  input[type=number] { width:85px; }
  button {
    background:#3a3a3a; color:var(--text);
    border:1px solid var(--border); padding:4px 8px;
    cursor:pointer; font-family:inherit; font-size:12px;
  }
  button:hover { background:#4a4a4a; }
  button.accent { background:#2a5a8f; }
  button.accent:hover { background:#3a6aaf; }
  .row { display:flex; gap:6px; align-items:center; margin:3px 0; }
  .row label { flex:0 0 88px; color:#bbb; font-size:11px; }
  .row input[type=range] { flex:1; min-width:40px; accent-color:var(--accent); }
  .row input.num-small { width:56px; flex-shrink:0; }
  .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px; }
  .preset-grid button { font-size:11px; padding:5px 3px; }
  .combo-list { display:flex; flex-direction:column; gap:4px; }
  .combo-btn {
    background:linear-gradient(90deg,#4a2a5f,#2a4a8f);
    border:1px solid #5a6a9f;
    padding:8px 6px; font-size:12px;
    text-align:left;
  }
  .combo-btn:hover { background:linear-gradient(90deg,#5a3a6f,#3a5a9f); }
  .color-key {
    display:flex; gap:4px; align-items:center; margin:3px 0;
    padding:3px; background:#1a1a1a; border:1px solid var(--border);
  }
  .color-key input[type=color] { width:34px; height:24px; padding:0; border:none; background:none; }
  .color-key input[type=number] { width:55px; }
  .color-key span { color:#888; font-size:10px; }
  #llm-panel { background:#1a1a1a; padding:8px; border:1px solid var(--border); margin:8px 0; }
  #llm-panel textarea { width:100%; min-height:50px; resize:vertical; }
  #info { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  .hint { color:#666; font-size:10px; margin-top:2px; }
  .tab-bar { display:flex; border-bottom:2px solid var(--border); margin-bottom:6px; gap:0; }
  .tab-bar button {
    flex:1; padding:8px 4px; font-size:12px; font-weight:bold;
    background:transparent; border:none; border-bottom:2px solid transparent;
    color:var(--muted); cursor:pointer; margin-bottom:-2px;
  }
  .tab-bar button:hover { color:var(--text); }
  .tab-bar button.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  .concept-card {
    background:#1a1a1a; border:1px solid var(--border); padding:8px;
    margin:4px 0; border-radius:4px;
  }
  .concept-card h3 { margin:0 0 6px; color:var(--accent); font-size:12px; }
  .concept-chips { display:flex; flex-wrap:wrap; gap:4px; }
  .concept-chips button {
    padding:5px 10px; font-size:11px; border-radius:12px;
    background:#2a2a2a; border:1px solid #444; color:#ccc;
  }
  .concept-chips button:hover { background:#3a3a3a; }
  .concept-chips button.selected { background:#2a5a8f; border-color:#4ea1ff; color:#fff; }
  .full-w { width:100%; }
  .full-w-btn { width:100%; }
  .select-dark {
    width:100%; background:#1a1a1a; color:var(--text);
    border:1px solid var(--border); padding:4px;
  }
  .select-inline {
    flex:1; background:#1a1a1a; color:var(--text);
    border:1px solid var(--border);
  }
  .mt-4 { margin-top:4px; }
  .mt-2 { margin-top:2px; }
  .text-dim { color:#555; }
  .file-hidden { display:none; }
  .palette-preview { margin-top:4px; line-height:14px; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="tab-bar">
    <button class="active" onclick="switchTab('tab-preset')">프리셋</button>
    <button onclick="switchTab('tab-concept')">컨셉</button>
    <button onclick="switchTab('tab-param')">파라미터</button>
  </div>

  <!-- ════ 탭 1: 프리셋 + LLM ════ -->
  <div id="tab-preset" class="tab-content active">
    <h2>★ 콤보 이펙트 (다중 레이어)</h2>
    <div class="combo-list" id="combo-list"></div>

    <h2>단일 프리셋 (2D)</h2>
    <input type="text" id="preset-search" placeholder="🔍 프리셋 검색...">
    <div class="preset-grid" id="preset-list"></div>

    <h2>✦ LLM 으로 생성</h2>
    <div id="llm-panel">
      <div class="row"><label>프로바이더</label></div>
      <select id="llm-provider" class="select-dark">
        <option value="claude">Claude (Anthropic)</option>

      <div class="row mt-4"><label>API Key</label></div>
      <input type="password" id="llm-key" class="full-w">
      <div class="row"><label>효과 설명</label></div>
      <textarea id="llm-prompt">거대한 보라색 어둠의 화염이 솟아오르는 효과</textarea>
      <div class="row">
        <button class="accent" onclick="generateLLM()">생성</button>
        <button id="llm-refine-btn" onclick="refineLLM()" disabled title="현재 렌더를 LLM에 보여주고 수정안 받기">🔍 비전으로 개선</button>
      </div>
      <div class="hint mt-4" id="llm-status"></div>
      <div class="hint" id="llm-key-help">https://console.anthropic.com 에서 키 발급</div>
      <div class="hint mt-2 text-dim">※ 비전 개선: 생성 후 누르면 현재 렌더 스크린샷을 LLM 에 보여주고 자동으로 수정합니다.</div>

    <div class="concept-card">
      <h3>움직임</h3>
      <div class="concept-chips" id="concept-movement">

        <button data-val="linear">직선</button>
        <button data-val="arc">포물선</button>
        <button data-val="wave">파동</button>
        <button data-val="spiral">나선</button>
        <button data-val="boomerang">부메랑</button>
        <button data-val="zigzag">지그재그</button>
        <button data-val="fall">낙하</button>
        <button data-val="rise">상승</button>

      <div class="hint mt-4">투사체 모드에서 캔버스를 드래그하면 방향/거리를 마우스로 조절할 수 있습니다.</div>
    </div>
    <div class="concept-card">
      <h3>속성</h3>
      <div class="concept-chips" id="concept-element">
        <button data-val="none" class="selected">없음</button>
        <button data-val="fire">불</button>
        <button data-val="ice">얼음</button>
        <button data-val="lightning">번개</button>
        <button data-val="poison">독</button>
        <button data-val="holy">빛</button>
        <button data-val="dark">어둠</button>
        <button data-val="water">물</button>

      <h3>역할</h3>
      <div class="concept-chips" id="concept-role">
        <button data-val="burst" class="selected">폭발/버스트</button>
        <button data-val="projectile">투사체</button>
        <button data-val="aura">오라/버프</button>
        <button data-val="trail">궤적/이동</button>
        <button data-val="ambient">환경/배경</button>
        <button data-val="impact">타격/히트</button>
        <button data-val="heal">치유/회복</button>
        <button data-val="shield">방어막</button>
        <button data-val="summon">소환/등장</button>
      </div>
    </div>
    <div class="concept-card file-hidden" id="concept-proj-opts">
      <h3>투사체 설정</h3>
      <div class="row"><label>속도</label><input type="range" id="cpt-speed" min="100" max="1000" value="400" step="50"><input type="number" id="cpt-speed-num" value="400" class="num-small" min="100" max="1000" step="50"></div>
      <div class="row"><label>거리</label><input type="range" id="cpt-dist" min="100" max="600" value="350" step="25"><input type="number" id="cpt-dist-num" value="350" class="num-small" min="100" max="600" step="25"></div>
      <div class="row"><label>각도</label><input type="range" id="cpt-angle" min="-180" max="180" value="0" step="15"><input type="number" id="cpt-angle-num" value="0" class="num-small" min="-180" max="180" step="15"></div>
      <div class="row"><label>본체 크기</label><input type="range" id="cpt-body" min="0" max="100" value="40" step="5"><input type="number" id="cpt-body-num" value="40" class="num-small" min="0" max="100" step="5"></div>
      <div class="row"><label>착탄 이펙트</label><select id="cpt-impact" class="select-inline"></select></div>
    </div>
    <h2>🎨 색 팔레트</h2>
    <select id="palette-select" class="select-dark"></select>
    <div id="palette-preview" class="palette-preview"></div>

    <h2>파일</h2>
    <div class="row">
      <button onclick="saveJson()">JSON 저장</button>
      <button onclick="document.getElementById('load-input').click()">JSON 불러오기</button>
      <input type="file" id="load-input" class="file-hidden" accept=".json">

    <div class="row">

    </div>

      <label>셀 크기(px)</label>
      <input type="number" id="sheet-cell" value="256" min="32" max="1024" step="32" class="num-small">
    </div>
    <div class="row">
      <label>FPS</label>
      <input type="number" id="sheet-fps" value="30" min="1" max="60" class="num-small">
    </div>
    <div class="row">
      <button class="accent full-w-btn" onclick="exportSpriteSheet()">📷 PNG + JSON 다운로드</button>
    </div>
    <div class="hint" id="sheet-status"></div>
  </div>

  <!-- ════ 탭 3: 파라미터 (상세) ════ -->
  <div id="tab-param" class="tab-content">
    <h2>파라미터</h2>
    <div id="param-panel"></div>
  </div>
</div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="fps-overlay"><span id="fps-num">60</span> FPS · <span id="fps-particles">0</span> p</div>
  </div>
  <div id="bottom">
    <button class="accent" id="play-btn" onclick="togglePlay()">▶ 재생</button>
    <button onclick="restart()" title="R">⟲ 리스타트</button>
    <button onclick="stepFrame()" title=". 한 프레임 전진">▶| 스텝</button>
    <button onclick="cycleBg()" title="B 배경 순환">◧ 배경</button>
    <button onclick="toggleGrid()" title="G 그리드 토글">⊞ 그리드</button>
    <button onclick="copyParamsJson()" title="파라미터 JSON 복사">📋 복사</button>
    <button onclick="undo()" title="Ctrl+Z 실행 취소">↩ Undo</button>
    <button onclick="redo()" title="Ctrl+Y 다시 실행">↪ Redo</button>
    <span id="info">particles: 0</span>
  </div>
</div>

<script>
// =================================================================
// ▼▼▼ ENGINE_INLINE_BEGIN — 이 블록은 engine.js 와 동일하게 유지됨 ▼▼▼
// file:// 에서 <script src> 가 차단되므로 engine.js 내용을 여기에 임베드.
// test.js 가 engine.js 파일 내용과 이 블록을 비교하여 드리프트를 감지한다.
// 수정 시에는 engine.js 를 먼저 수정한 뒤 이 블록을 동기화하고 test.js 재실행.
// =================================================================
// ==================== Math / Utility ====================
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }

// ==================== Easing Curves ====================
function sampleCurve(name, t) {
  switch (name) {
    case 'easeOut': return 1 - (1 - t) * (1 - t);
    case 'easeIn':  return t * t;
    case 'easeInOut': return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    case 'easeOutBack': {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    case 'linear':
    default: return t;
  }
}

// ==================== Color Interpolation ====================
function sampleColor(keys, t) {
  if (!keys || keys.length === 0) return { r:1, g:1, b:1, a:1 };
  if (t <= keys[0].t) return keys[0];
  if (t >= keys[keys.length - 1].t) return keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) {
    const k1 = keys[i], k2 = keys[i + 1];
    if (t >= k1.t && t <= k2.t) {
      const span = k2.t - k1.t;
      const u = span > 0 ? (t - k1.t) / span : 0;
      return {
        r: lerp(k1.r, k2.r, u),
        g: lerp(k1.g, k2.g, u),
        b: lerp(k1.b, k2.b, u),
        a: lerp(k1.a, k2.a, u),
      };
    }
  }
  return keys[0];
}

// ==================== Color Palettes ====================
const PALETTES = {
  'none': null,
  'PICO-8': [
    [0,0,0],[29,43,83],[126,37,83],[0,135,81],[171,82,54],[95,87,79],
    [194,195,199],[255,241,232],[255,0,77],[255,163,0],[255,236,39],
    [0,228,54],[41,173,255],[131,118,156],[255,119,168],[255,204,170],
  ],
  'Game Boy': [
    [15,56,15],[48,98,48],[139,172,15],[155,188,15],
  ],
  'NES-ish': [
    [0,0,0],[0,0,188],[0,120,248],[60,188,252],[252,252,252],
    [248,0,0],[252,160,68],[252,224,168],[0,168,0],[184,248,184],
    [168,0,188],[248,216,248],[188,188,188],[120,120,120],
    [252,252,168],[252,60,140],
  ],
  'Endesga 16': [
    [228,59,68],[158,40,53],[190,105,41],[237,174,45],[253,231,104],
    [158,230,91],[56,181,84],[34,99,83],[14,41,63],[59,87,119],
    [95,141,165],[171,221,232],[255,255,255],[194,193,194],[103,106,107],
    [31,23,31],
  ],
};

function quantizeToPalette(r, g, b, palette) {
  if (!palette) return null;
  let bestIdx = 0, bestDist = Infinity;
  for (let i = 0; i < palette.length; i++) {
    const p = palette[i];
    const dr = r - p[0], dg = g - p[1], db = b - p[2];
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  return palette[bestIdx];
}

function colorBucket(r, g, b) {
  return ((r >> 5) << 6) | ((g >> 5) << 3) | (b >> 5);
}

// ==================== Shape Inside Test (pixel rasterization) ====================

// 공통 ray-casting 점-다각형 내부 판정
function polyInsideFn(verts) {
  const n = verts.length / 2;
  return (x, y) => {
    let inside = false;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const xi = verts[i * 2], yi = verts[i * 2 + 1];
      const xj = verts[j * 2], yj = verts[j * 2 + 1];
      if (((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  };
}

// 정다각형 또는 별형 정점 생성
function makePolyVerts(count, outerR, innerR, angleOffset) {
  const verts = [];
  const hasInner = innerR !== undefined && innerR !== outerR;
  const total = hasInner ? count * 2 : count;
  for (let i = 0; i < total; i++) {
    const rad = hasInner ? ((i & 1) ? innerR : outerR) : outerR;
    const ang = (i / total) * Math.PI * 2 - Math.PI / 2 + (angleOffset || 0);
    verts.push(Math.cos(ang) * rad, Math.sin(ang) * rad);
  }
  return verts;
}

function makeInsideFn(shape, R) {
  const R2 = R * R + R * 0.5;
  switch (shape) {
    case 'square':
      return (x, y) => Math.abs(x) <= R && Math.abs(y) <= R;
    case 'diamond':
      return (x, y) => Math.abs(x) + Math.abs(y) <= R;
    case 'triangle':
      return (x, y) => {
        if (y < -R || y > R * 0.5) return false;
        const maxX = (y + R) * 0.58;
        return Math.abs(x) <= maxX;
      };
    case 'star':
      return polyInsideFn(makePolyVerts(5, R, R * 0.45));
    case 'teardrop':
      return (x, y) => {
        if (y <= 0) return x * x + y * y <= R2;
        if (y > R) return false;
        const maxX = R * (1 - y / R);
        return Math.abs(x) <= maxX;
      };
    case 'ring': {
      const innerR2 = (R * 0.55) * (R * 0.55);
      return (x, y) => {
        const d2 = x * x + y * y;
        return d2 <= R2 && d2 >= innerR2;
      };
    }
    case 'cross': {
      const bar = R * 0.35;
      return (x, y) => {
        const ax = Math.abs(x), ay = Math.abs(y);
        return (ax <= bar && ay <= R) || (ax <= R && ay <= bar);
      };
    }
    case 'hexagon':
      return polyInsideFn(makePolyVerts(6, R));
    case 'spark':
      return polyInsideFn(makePolyVerts(4, R, R * 0.22));
    case 'crescent': {
      const innerR2 = (R * 0.85) * (R * 0.85);
      const ox = R * 0.35;
      return (x, y) => {
        const d1 = x * x + y * y;
        if (d1 > R2) return false;
        const d2 = (x - ox) * (x - ox) + y * y;
        return d2 > innerR2;
      };
    }
    case 'flame':
      return (x, y) => {
        if (y <= 0) {
          const xs = x / (R * 0.5);
          const ys = y / (R * 1.1);
          return xs * xs + ys * ys <= 1;
        }
        if (y > R) return false;
        const t = y / R;
        const maxX = R * (1 - t * t * 0.6);
        return Math.abs(x) <= maxX;
      };
    case 'pentagon':
      return polyInsideFn(makePolyVerts(5, R));
    case 'octagon':
      return polyInsideFn(makePolyVerts(8, R));
    case 'bar':
      return (x, y) => Math.abs(x) <= R && Math.abs(y) <= R * 0.25;
    case 'pill': {
      const halfH = R * 0.4;
      const straightW = R - halfH;
      return (x, y) => {
        if (Math.abs(y) > halfH) return false;
        const ax = Math.abs(x);
        if (ax <= straightW) return true;
        const dx = ax - straightW;
        return dx * dx + y * y <= halfH * halfH;
      };
    }
    case 'ellipse': {
      const ry = R * 0.5;
      return (x, y) => {
        const a = x / R, b = y / ry;
        return a * a + b * b <= 1;
      };
    }
    case 'bubble': {
      const innerR2 = (R * 0.85) * (R * 0.85);
      return (x, y) => {
        const d2 = x * x + y * y;
        return d2 <= R2 && d2 >= innerR2;
      };
    }
    case 'heart': {
      const s = R * 0.85;
      return (x, y) => {
        const nx = x / s, ny = -y / s;
        const a = nx * nx + ny * ny - 1;
        return a * a * a - nx * nx * ny * ny * ny <= 0;
      };
    }
    case 'snowflake': {
      const thick = R * 0.15;
      return (x, y) => {
        for (let i = 0; i < 3; i++) {
          const ang = (i / 6) * Math.PI * 2;
          const cs = Math.cos(ang), sn = Math.sin(ang);
          const lx = x * cs + y * sn;
          const ly = -x * sn + y * cs;
          if (Math.abs(lx) <= thick && Math.abs(ly) <= R) return true;
        }
        return x * x + y * y <= R * R * 0.1;
      };
    }
    case 'bolt':
      return polyInsideFn([
        0, -R, -R * 0.4, -R * 0.2, 0, -R * 0.2,
        -R * 0.4, R, R * 0.4, -R * 0.1, 0, -R * 0.1,
      ]);
    case 'shuriken':
      return polyInsideFn(makePolyVerts(4, R, R * 0.5, Math.PI / 4));
    case 'arrow':
      return polyInsideFn([
        0, -R, R, -R + R * 0.7, R * 0.25, -R + R * 0.7,
        R * 0.25, R, -R * 0.25, R, -R * 0.25, -R + R * 0.7,
        -R, -R + R * 0.7,
      ]);
    case 'leaf': {
      const h = R * 0.6;
      return (x, y) => {
        if (Math.abs(x) > R) return false;
        const t = x / R;
        const maxY = h * (1 - t * t);
        return Math.abs(y) <= maxY;
      };
    }
    case 'chevron':
      return polyInsideFn([
        -R, -R, 0, -R * 0.3, R, 0,
        0, R * 0.3, -R, R, -R * 0.3, 0,
      ]);
    case 'shield': {
      return (x, y) => {
        if (Math.abs(x) > R) return false;
        if (y < -R || y > R) return false;
        if (y <= R * 0.2) return true;
        const ry = R * 0.8;
        const ny = (y - R * 0.2) / ry;
        const nx = x / R;
        return nx * nx + ny * ny <= 1;
      };
    }
    case 'sparkle':
      return polyInsideFn(makePolyVerts(4, R, R * 0.1));
    case 'circle':
    default:
      return (x, y) => x * x + y * y <= R2;
  }
}

const ALL_SHAPES = ['circle','square','diamond','triangle','star','teardrop',
                    'ring','cross','hexagon','spark','crescent','flame',
                    'pentagon','octagon','bar','pill','ellipse','bubble',
                    'heart','snowflake','bolt','shuriken','arrow','leaf',
                    'chevron','shield','sparkle'];

// ==================== JSON Extraction (for LLM responses) ====================
function extractJson(text) {
  if (!text) return null;
  // 마크다운 코드블록 제거
  let cleaned = text.replace(/```(?:json)?\s*\n?/gi, '').replace(/```/g, '').trim();
  if (cleaned.startsWith('{') && cleaned.endsWith('}')) {
    try { JSON.parse(cleaned); return cleaned; } catch(_) {}
  }
  const start = cleaned.indexOf('{');
  if (start < 0) return null;
  let depth = 0;
  let inStr = false;
  let esc = false;
  for (let i = start; i < cleaned.length; i++) {
    const ch = cleaned[i];
    if (esc) { esc = false; continue; }
    if (ch === '\\') { esc = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === '{') depth++;
    else if (ch === '}') {
      depth--;
      if (depth === 0) return cleaned.substring(start, i + 1);
    }
  }
  return null;
}

// ==================== LLM Helpers ====================
function pickBestGeminiModel(available, forVision) {
  const visionPriorities = [
    /^gemini-1\.5-flash-latest$/,
    /^gemini-1\.5-flash$/,
    /^gemini-1\.5-flash-\d/,
    /^gemini-2\.0-flash$/,
    /^gemini-2\.0-flash-exp/,
    /^gemini-flash-latest$/,
    /^gemini-2\.5-flash$/,
    /^gemini-1\.5-pro-latest$/,
    /^gemini-1\.5-pro$/,
    /^gemini-2\.5-pro$/,
    /^gemini-2\.0-pro/,
  ];
  const textPriorities = [
    /^gemini-2\.5-flash$/,
    /^gemini-2\.0-flash$/,
    /^gemini-2\.0-flash-exp/,
    /^gemini-flash-latest$/,
    /^gemini-1\.5-flash-latest$/,
    /^gemini-1\.5-flash$/,
    /^gemini-2\.5-pro$/,
    /^gemini-2\.0-pro/,
    /^gemini-1\.5-pro-latest$/,
    /^gemini-1\.5-pro$/,
    /^gemini-pro$/,
  ];
  const priorities = forVision ? visionPriorities : textPriorities;
  for (const pat of priorities) {
    const found = available.find(m => pat.test(m));
    if (found) return found;
  }
  return available[0];
}

function humanizeLLMError(err, providerLabel) {
  const msg = String(err && err.message || err || '').toLowerCase();
  const full = String(err && err.message || err || '');

  if (/\b429\b/.test(msg) || msg.includes('quota') || msg.includes('rate limit') || msg.includes('rate_limit')) {
    return `⚠️ ${providerLabel} 할당량 초과 — 무료 토큰 소진/분당 제한. 1분 대기 후 재시도하거나 다른 프로바이더 사용`;
  }
  if (/\b402\b/.test(msg) || msg.includes('insufficient') || msg.includes('payment') || msg.includes('billing') || msg.includes('credit balance')) {
    return `💳 ${providerLabel} 크레딧 부족 — 계정 결제 정보 확인 또는 다른 프로바이더 사용`;
  }
  if (/\b401\b/.test(msg) || msg.includes('unauthorized') || msg.includes('invalid api key') || msg.includes('invalid_api_key')) {
    return `🔑 ${providerLabel} API 키 오류 — 키 값을 확인하거나 재발급`;
  }
  if (/\b403\b/.test(msg) || msg.includes('forbidden') || msg.includes('permission')) {
    return `🚫 ${providerLabel} 접근 권한 없음 — API 키에 해당 모델 권한이 없습니다`;
  }
  if (/\b503\b/.test(msg) || msg.includes('overloaded') || msg.includes('unavailable')) {
    return `🔧 ${providerLabel} 서버 과부하 — 잠시 후 재시도`;
  }
  if (/\b400\b/.test(msg) || msg.includes('invalid_argument') || msg.includes('bad request')) {
    return `❌ ${providerLabel} 요청 형식 오류 — F12 콘솔에서 상세 확인`;
  }
  if (/\b500\b/.test(msg) || msg.includes('internal')) {
    return `🔥 ${providerLabel} 서버 내부 오류 — 재시도 필요`;
  }
  if (msg.includes('failed to fetch') || msg.includes('network')) {
    return `📡 네트워크 오류 — 인터넷 연결 확인`;
  }
  if (msg.includes('context length') || msg.includes('max tokens') || msg.includes('token limit')) {
    return `📏 ${providerLabel} 토큰 한도 초과 — 프롬프트가 너무 김`;
  }
  if (msg.includes('json')) {
    return `📝 ${providerLabel} JSON 응답 파싱 실패 — 재시도 권장`;
  }
  return `오류(${providerLabel}): ` + full.slice(0, 200) + ' — F12 콘솔에서 상세 확인';
}

// ==================== Projectile Position ====================
function projectilePos(pr, t) {
  const rad = (pr.projAngle || 0) * Math.PI / 180;
  const dist = pr.projDistance;
  const dx = Math.cos(rad) * dist;
  const dy = Math.sin(rad) * dist;
  let x = dx * t;
  let y = dy * t;
  switch (pr.projPath) {
    case 'arc': {
      const h = pr.projArcHeight || 100;
      y += -4 * h * t * (1 - t);
      break;
    }
    case 'wave': {
      const amp = pr.projWaveAmp || 30;
      const freq = pr.projWaveFreq || 3;
      const perpX = -Math.sin(rad);
      const perpY = Math.cos(rad);
      const wave = Math.sin(t * Math.PI * 2 * freq) * amp;
      x += perpX * wave;
      y += perpY * wave;
      break;
    }
    case 'spiral': {
      const spiralR = dist * 0.3 * (1 - t);
      const spiralAngle = t * Math.PI * 6;
      x = dx * t + Math.cos(spiralAngle) * spiralR;
      y = dy * t + Math.sin(spiralAngle) * spiralR;
      break;
    }
    case 'boomerang': {
      const ease = t < 0.5 ? 2 * t : 2 * (1 - t);
      x = dx * ease;
      y = dy * ease + -4 * (pr.projArcHeight || 80) * t * (1 - t);
      break;
    }
    case 'zigzag': {
      const seg = 6;
      const phase = (t * seg) % 2;
      const perpX = -Math.sin(rad);
      const perpY = Math.cos(rad);
      const amp = pr.projWaveAmp || 40;
      const offset = (phase < 1 ? phase : 2 - phase) * 2 - 1;
      x = dx * t + perpX * offset * amp;
      y = dy * t + perpY * offset * amp;
      break;
    }
  }
  return { x, y };
}

// =================================================================
//                    JSON 로드 안전 검증
// =================================================================
function sanitizeParams(obj) {
  const def = defaultParams();
  const VALID_SHAPES = ['Point','Circle','Disc','Box','Cone'];
  const VALID_PARTICLE_SHAPES = ALL_SHAPES;
  const VALID_BLEND_MODES = ['Alpha','Additive'];
  const VALID_SIZE_CURVES = ['linear','easeOut','easeIn','easeInOut','easeOutBack'];

  // 수치 범위 제한 (메모리 폭발 방지)
  const clamp = (v, lo, hi, fallback) => {
    if (typeof v !== 'number' || !isFinite(v)) return fallback;
    return Math.max(lo, Math.min(hi, v));
  };

  obj.duration    = clamp(obj.duration, 0.01, 60, def.duration);
  obj.rate        = clamp(obj.rate, 0, 5000, def.rate);
  obj.burstCount  = clamp(obj.burstCount, 0, 5000, def.burstCount);
  obj.lifetimeMin = clamp(obj.lifetimeMin, 0, 30, def.lifetimeMin);
  obj.lifetimeMax = clamp(obj.lifetimeMax, obj.lifetimeMin, 30, def.lifetimeMax);
  obj.speedMin    = clamp(obj.speedMin, -5000, 5000, def.speedMin);
  obj.speedMax    = clamp(obj.speedMax, obj.speedMin, 5000, def.speedMax);
  obj.sizeStart   = clamp(obj.sizeStart, 0, 1000, def.sizeStart);
  obj.sizeEnd     = clamp(obj.sizeEnd, 0, 1000, def.sizeEnd);
  obj.gravity     = clamp(obj.gravity, -5000, 5000, def.gravity);
  obj.drag        = clamp(obj.drag, 0, 100, def.drag);
  obj.pixelScale  = clamp(obj.pixelScale, 1, 8, def.pixelScale);
  obj.fadeIn      = clamp(obj.fadeIn, 0, 1, def.fadeIn);
  obj.fadeOut      = clamp(obj.fadeOut, 0, 1, def.fadeOut);

  // 열거형 검증
  if (!VALID_SHAPES.includes(obj.shape)) obj.shape = def.shape;
  if (!VALID_PARTICLE_SHAPES.includes(obj.particleShape)) obj.particleShape = def.particleShape;
  if (!VALID_BLEND_MODES.includes(obj.blendMode)) obj.blendMode = def.blendMode;
  if (obj.sizeCurve && !VALID_SIZE_CURVES.includes(obj.sizeCurve)) obj.sizeCurve = def.sizeCurve;

  // 투사체 검증
  obj.projSpeed    = clamp(obj.projSpeed, 50, 2000, def.projSpeed);
  obj.projDistance  = clamp(obj.projDistance, 50, 800, def.projDistance);
  obj.projAngle    = clamp(obj.projAngle, -180, 180, def.projAngle);
  obj.projArcHeight = clamp(obj.projArcHeight, 0, 400, def.projArcHeight);
  obj.projWaveAmp  = clamp(obj.projWaveAmp, 0, 200, def.projWaveAmp);
  obj.projWaveFreq = clamp(obj.projWaveFreq, 1, 10, def.projWaveFreq);
  const VALID_PROJ_PATHS = ['linear','arc','wave'];
  if (obj.projPath && !VALID_PROJ_PATHS.includes(obj.projPath)) obj.projPath = def.projPath;

  // colorKeys 검증
  if (!Array.isArray(obj.colorKeys) || obj.colorKeys.length === 0) {
    obj.colorKeys = def.colorKeys;
  } else {
    obj.colorKeys = obj.colorKeys.filter(k =>
      typeof k.r === 'number' && typeof k.g === 'number' &&
      typeof k.b === 'number' && typeof k.a === 'number' &&
      typeof k.t === 'number' && k.t >= 0 && k.t <= 1
    );
    if (obj.colorKeys.length === 0) obj.colorKeys = def.colorKeys;
  }

  return obj;
}

// ═══════════════════════ Undo / Redo ═══════════════════════
const undoStack = [];
const redoStack = [];
const UNDO_LIMIT = 50;

function pushUndo() {
  undoStack.push(JSON.stringify(mainSys.params));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0; // redo 초기화
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(JSON.stringify(mainSys.params));
  const prev = JSON.parse(undoStack.pop());
  extraSystems = [];
  mainSys.params = prev;
  refreshPanel();
  restart();
  showFlash('↩ Undo');
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(JSON.stringify(mainSys.params));
  const next = JSON.parse(redoStack.pop());
  extraSystems = [];
  mainSys.params = next;
  refreshPanel();
  restart();
  showFlash('↪ Redo');
}

// Ctrl+Z / Ctrl+Y 키보드 바인딩
document.addEventListener('keydown', e => {
  // 입력 필드에서는 무시
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
});

function triggerFX() {
  const p = mainSys.params;
  if (p.shakeAmount > 0) {
    fxShakeMax = p.shakeAmount;
    fxShakeDurTotal = Math.max(0.01, p.shakeDuration || 0.3);
    fxShakeT = fxShakeDurTotal;
  } else {
    fxShakeT = 0;
  }
  if (p.flashAmount > 0) {
    fxFlashMax = p.flashAmount;
    fxFlashDurTotal = Math.max(0.01, p.flashDuration || 0.12);
    fxFlashT = fxFlashDurTotal;
  } else {
    fxFlashT = 0;
  }
  fxHitStop = p.hitStop > 0 ? p.hitStop : 0;
}

// 기존 GUI 코드가 `params.*` 를 그대로 쓸 수 있도록 Proxy (mainSys.params 로 포워드)
const params = new Proxy({}, {
  get(_, k) { return mainSys.params[k]; },
  set(_, k, v) { mainSys.params[k] = v; return true; },
  has(_, k) { return k in mainSys.params; },
  ownKeys()  { return Object.keys(mainSys.params); },
  getOwnPropertyDescriptor(_, k) {
    return { enumerable: true, configurable: true, value: mainSys.params[k] };
  },
});

// =================================================================
//                  마우스 드래그 → 투사체 방향/거리
// =================================================================
canvas.addEventListener('mousedown', e => {
  if (!mainSys.params.projectile) return;
  const rect = canvas.getBoundingClientRect();
  dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
});
canvas.addEventListener('mousemove', e => {
  if (!dragStart) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const dx = mx - cx, dy = my - cy;
  const dist = Math.min(800, Math.sqrt(dx * dx + dy * dy));
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  mainSys.params.projDistance = Math.max(50, dist);
  mainSys.params.projAngle = Math.round(angle);
  // 컨셉 슬라이더 동기화
  const dEl = document.getElementById('cpt-dist');
  const dNum = document.getElementById('cpt-dist-num');
  const aEl = document.getElementById('cpt-angle');
  const aNum = document.getElementById('cpt-angle-num');
  if (dEl) { dEl.value = mainSys.params.projDistance; }
  if (dNum) { dNum.value = Math.round(mainSys.params.projDistance); }
  if (aEl) { aEl.value = mainSys.params.projAngle; }
  if (aNum) { aNum.value = mainSys.params.projAngle; }
  restart();
});
canvas.addEventListener('mouseup', () => { dragStart = null; });
canvas.addEventListener('mouseleave', () => { dragStart = null; });

// =================================================================
//                         파티클 엔진
// =================================================================

function spawnParticle(sys) {
  const pr = sys.params;
  const p = {};
  p.life = 0;
  p.maxLife = rand(pr.lifetimeMin, pr.lifetimeMax);

  // 위치 + 기본 방향 계산
  let px = 0, py = 0, dx = 0, dy = 0;
  switch (pr.shape) {
    case 'Point': {
      const a = Math.random() * Math.PI * 2;
      dx = Math.cos(a); dy = Math.sin(a);
      break;
    }
    case 'Circle': {
      const a = Math.random() * Math.PI * 2;
      px = Math.cos(a) * pr.shapeRadius;
      py = Math.sin(a) * pr.shapeRadius;
      dx = Math.cos(a); dy = Math.sin(a);
      break;
    }
    case 'Disc': {
      // 원 내부 균등 분포 (√random 으로 면적 균등)
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * pr.shapeRadius;
      px = Math.cos(a) * r;
      py = Math.sin(a) * r;
      dx = Math.cos(a); dy = Math.sin(a);
      break;
    }
    case 'Box': {
      px = (Math.random() - 0.5) * pr.shapeBoxW;
      py = (Math.random() - 0.5) * pr.shapeBoxH;
      const a = Math.random() * Math.PI * 2;
      dx = Math.cos(a); dy = Math.sin(a);
      break;
    }
    case 'Cone': {
      // Cone은 위쪽(-y)을 향해 coneAngle 내에서 분출
      const half = pr.coneAngle * Math.PI / 180;
      const a = (Math.random() - 0.5) * 2 * half - Math.PI / 2;
      dx = Math.cos(a); dy = Math.sin(a);
      break;
    }
  }
  // 투사체 모드: 이미터 위치 오프셋 적용
  if (pr.projectile) {
    px += sys.projX;
    py += sys.projY;
  }
  // 착탄 이펙트: 착탄 위치 오프셋 적용
  if (sys._isImpact) {
    px += sys._offsetX;
    py += sys._offsetY;
  }
  p.x = px;
  p.y = py;

  const speed = rand(pr.speedMin, pr.speedMax);
  p.vx = dx * speed + pr.directionX;
  p.vy = dy * speed - pr.directionY; // 사용자 관점 +Y=위 → canvas -y

  const szFactor = rand(1 - pr.sizeRandom, 1 + pr.sizeRandom);
  p.startSize = pr.sizeStart * szFactor;
  p.endSize = pr.sizeEnd;

  p.rotation = (Math.random() * 2 - 1) * pr.rotationRandom * Math.PI / 180;
  p.rotSpeed = pr.rotationSpeed * Math.PI / 180;

  sys.particles.push(p);
}

function updateSystem(sys, dt) {
  const pr = sys.params;
  sys.systemTime += dt;

  // 투사체 위치 업데이트
  if (pr.projectile && !sys.projDone) {
    const travelTime = pr.projDistance / pr.projSpeed;
    sys.projT = Math.min(1, sys.systemTime / travelTime);
    const pos = projectilePos(pr, sys.projT);
    sys.projX = pos.x;
    sys.projY = pos.y;
    if (sys.projT >= 1) {
      sys.projDone = true;
      // 착탄 이펙트 트리거
      if (pr.projImpact && pr.projImpact !== 'none' && typeof PRESETS !== 'undefined' && PRESETS[pr.projImpact]) {
        const impactParams = Object.assign(defaultParams(), PRESETS[pr.projImpact]);
        impactParams.loop = false;
        impactParams.projectile = false;
        // 착탄 위치에서 버스트 생성
        const impactSys = makeSys(impactParams);
        impactSys.projX = 0; impactSys.projY = 0;
        // 착탄 위치 오프셋: 파티클 좌표계에서 이미터 위치를 직접 반영
        impactSys._offsetX = sys.projX;
        impactSys._offsetY = sys.projY;
        impactSys._isImpact = true;
        extraSystems.push(impactSys);
        // 착탄 시 FX 트리거
        if (impactParams.shakeAmount > 0) {
          fxShakeMax = impactParams.shakeAmount;
          fxShakeDurTotal = impactParams.shakeDuration;
          fxShakeT = fxShakeDurTotal;
        }
        if (impactParams.flashAmount > 0) {
          fxFlashMax = impactParams.flashAmount;
          fxFlashDurTotal = impactParams.flashDuration;
          fxFlashT = fxFlashDurTotal;
        }
      }
    }
  }

  // 방출 — 투사체 모드에서는 이동 완료까지 자동 연장
  const projBlocked = pr.projectile && sys.projDone;
  const effectiveDuration = pr.projectile
    ? Math.max(pr.duration, pr.projDistance / pr.projSpeed)
    : pr.duration;
  const emitActive = !projBlocked && (pr.loop || sys.systemTime < effectiveDuration);
  if (emitActive) {
    if (pr.burstCount > 0) {
      if (pr.burstSpread > 0) {
        // 분산 버스트 — burstSpread 초 동안 점진적 스폰
        const progress = Math.min(1, sys.systemTime / pr.burstSpread);
        const wanted = Math.floor(progress * pr.burstCount);
        while (sys.burstEmitted < wanted) {
          spawnParticle(sys);
          sys.burstEmitted++;
        }
      } else if (!sys.burstDone) {
        for (let i = 0; i < pr.burstCount; i++) spawnParticle(sys);
        sys.burstDone = true;
      }
    }
    if (pr.rate > 0) {
      sys.emitAccum += dt * pr.rate;
      while (sys.emitAccum >= 1) { spawnParticle(sys); sys.emitAccum -= 1; }
    }
  }

  // 루프 처리
  if (pr.loop && sys.systemTime >= effectiveDuration) {
    sys.systemTime -= effectiveDuration;
    sys.burstDone = false;
    sys.burstEmitted = 0;
    sys.projT = 0; sys.projDone = false; sys.projX = 0; sys.projY = 0;
  }

  // 비루프 자동 리스타트(편의)
  if (!pr.loop && sys.systemTime >= effectiveDuration && sys.particles.length === 0) {
    sys.systemTime = 0;
    sys.burstDone = false;
    sys.burstEmitted = 0;
    sys.projT = 0; sys.projDone = false; sys.projX = 0; sys.projY = 0;
  }

  // 파티클 업데이트
  const dtScale = dt * 60; // 60fps 기준 보정 (jitter/turbulence 의 속도)
  for (let i = sys.particles.length - 1; i >= 0; i--) {
    const p = sys.particles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { sys.particles.splice(i, 1); continue; }

    // 중력: 양수 = 아래 (canvas +y)
    p.vy += pr.gravity * dt;

    // Jitter — 속도에 랜덤 요동 (살아있는 느낌)
    if (pr.jitter > 0) {
      p.vx += (Math.random() - 0.5) * 2 * pr.jitter * dtScale;
      p.vy += (Math.random() - 0.5) * 2 * pr.jitter * dtScale;
    }

    // Turbulence — 사인파 기반 부드러운 바람 (연기/꽃잎)
    if (pr.turbulence > 0) {
      const tx = Math.sin(p.y * 0.02 + sys.systemTime * 1.3 + p.maxLife * 2);
      const ty = Math.cos(p.x * 0.02 + sys.systemTime * 1.1 + p.maxLife * 3);
      p.vx += tx * pr.turbulence * dt;
      p.vy += ty * pr.turbulence * dt;
    }

    // Orbit / Attract — 중심 기준 회전·흡인 (소용돌이)
    if (pr.orbit !== 0 || pr.attract !== 0) {
      const r2 = p.x * p.x + p.y * p.y;
      if (r2 > 1) {
        const r = Math.sqrt(r2);
        const rx = p.x / r; // 방사 방향 단위 벡터
        const ry = p.y / r;
        if (pr.orbit !== 0) {
          // 접선 방향 (반시계가 양수 기준): (-ry, rx)
          p.vx += -ry * pr.orbit * dt;
          p.vy += rx * pr.orbit * dt;
        }
        if (pr.attract !== 0) {
          // 중심 방향으로 당김
          p.vx -= rx * pr.attract * dt;
          p.vy -= ry * pr.attract * dt;
        }
      }
    }

    // 드래그
    if (pr.drag > 0) {
      const f = Math.max(0, 1 - pr.drag * dt);
      p.vx *= f; p.vy *= f;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rotation += p.rotSpeed * dt;
  }
}

// 2D 스프라이트 모양 렌더
function drawShape(c, shape, r, fillStyle, outlineW) {
  if (r <= 0) return;
  c.fillStyle = fillStyle;
  c.beginPath();
  let useEvenOdd = false;
  switch (shape) {
    case 'square':
      c.rect(-r, -r, r * 2, r * 2);
      break;
    case 'diamond':
      c.moveTo(0, -r); c.lineTo(r, 0);
      c.lineTo(0, r);  c.lineTo(-r, 0);
      c.closePath();
      break;
    case 'triangle':
      c.moveTo(0, -r);
      c.lineTo(r * 0.87, r * 0.5);
      c.lineTo(-r * 0.87, r * 0.5);
      c.closePath();
      break;
    case 'star': {
      const pts = 5, outer = r, inner = r * 0.45;
      for (let i = 0; i < pts * 2; i++) {
        const rad = (i & 1) ? inner : outer;
        const ang = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(ang) * rad;
        const y = Math.sin(ang) * rad;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      break;
    }
    case 'teardrop':
      c.moveTo(0, -r);
      c.bezierCurveTo(r, -r * 0.6, r, r * 0.4, 0, r);
      c.bezierCurveTo(-r, r * 0.4, -r, -r * 0.6, 0, -r);
      break;
    case 'ring':
      c.arc(0, 0, r, 0, Math.PI * 2, false);
      c.moveTo(r * 0.55, 0);
      c.arc(0, 0, r * 0.55, 0, Math.PI * 2, true);
      useEvenOdd = true;
      break;
    case 'cross': {
      const bar = r * 0.35;
      c.rect(-bar, -r, bar * 2, r * 2);
      c.rect(-r, -bar, r * 2, bar * 2);
      break;
    }
    case 'hexagon':
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(ang) * r;
        const y = Math.sin(ang) * r;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      break;
    case 'spark': {
      // 4각 섬광 — 긴 꼭짓점 + 좁은 내부
      const pts = 4, outer = r, inner = r * 0.22;
      for (let i = 0; i < pts * 2; i++) {
        const rad = (i & 1) ? inner : outer;
        const ang = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(ang) * rad;
        const y = Math.sin(ang) * rad;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      break;
    }
    case 'crescent':
      c.arc(0, 0, r, 0, Math.PI * 2, false);
      c.moveTo(r * 0.35 + r * 0.85, 0);
      c.arc(r * 0.35, 0, r * 0.85, 0, Math.PI * 2, true);
      useEvenOdd = true;
      break;
    case 'flame':
      // 비대칭 불꽃 — 상단 얇고 하단 풍성
      c.moveTo(0, -r * 1.1);
      c.bezierCurveTo(r * 0.45, -r * 0.5, r * 0.95, r * 0.3, 0, r);
      c.bezierCurveTo(-r * 0.95, r * 0.3, -r * 0.45, -r * 0.5, 0, -r * 1.1);
      break;
    case 'pentagon': {
      for (let i = 0; i < 5; i++) {
        const ang = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      break;
    }
    case 'octagon': {
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      break;
    }
    case 'bar':
      c.rect(-r, -r * 0.25, r * 2, r * 0.5);
      break;
    case 'pill': {
      const w = r, h = r * 0.4;
      c.moveTo(-w + h, -h);
      c.lineTo(w - h, -h);
      c.arc(w - h, 0, h, -Math.PI / 2, Math.PI / 2);
      c.lineTo(-w + h, h);
      c.arc(-w + h, 0, h, Math.PI / 2, -Math.PI / 2);
      c.closePath();
      break;
    }
    case 'ellipse':
      c.ellipse(0, 0, r, r * 0.5, 0, 0, Math.PI * 2);
      break;
    case 'bubble':
      c.arc(0, 0, r, 0, Math.PI * 2, false);
      c.moveTo(r * 0.85, 0);
      c.arc(0, 0, r * 0.85, 0, Math.PI * 2, true);
      useEvenOdd = true;
      break;
    case 'heart': {
      const R_ = r;
      c.moveTo(0, -R_ * 0.3);
      c.bezierCurveTo(-R_, -R_, -R_, R_ * 0.3, 0, R_);
      c.bezierCurveTo(R_, R_ * 0.3, R_, -R_, 0, -R_ * 0.3);
      break;
    }
    case 'snowflake': {
      const thick = r * 0.15;
      for (let i = 0; i < 3; i++) {
        c.save();
        c.rotate((i / 6) * Math.PI * 2);
        c.rect(-thick, -r, thick * 2, r * 2);
        c.restore();
      }
      c.moveTo(r * 0.3, 0);
      c.arc(0, 0, r * 0.3, 0, Math.PI * 2);
      break;
    }
    case 'bolt': {
      c.moveTo(0, -r);
      c.lineTo(-r * 0.4, -r * 0.2);
      c.lineTo(0, -r * 0.2);
      c.lineTo(-r * 0.4, r);
      c.lineTo(r * 0.4, -r * 0.1);
      c.lineTo(0, -r * 0.1);
      c.closePath();
      break;
    }
    case 'shuriken': {
      const pts = 4, outer = r, inner = r * 0.5;
      const offset = Math.PI / 4;
      for (let i = 0; i < pts * 2; i++) {
        const rad = (i & 1) ? inner : outer;
        const ang = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2 + offset;
        const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      break;
    }
    case 'arrow': {
      const headH = r * 0.7, tailW = r * 0.25;
      c.moveTo(0, -r);
      c.lineTo(r, -r + headH);
      c.lineTo(tailW, -r + headH);
      c.lineTo(tailW, r);
      c.lineTo(-tailW, r);
      c.lineTo(-tailW, -r + headH);
      c.lineTo(-r, -r + headH);
      c.closePath();
      break;
    }
    case 'leaf':
      c.moveTo(-r, 0);
      c.quadraticCurveTo(0, -r * 0.6, r, 0);
      c.quadraticCurveTo(0, r * 0.6, -r, 0);
      break;
    case 'chevron': {
      c.moveTo(-r, -r);
      c.lineTo(0, -r * 0.3);
      c.lineTo(r, 0);
      c.lineTo(0, r * 0.3);
      c.lineTo(-r, r);
      c.lineTo(-r * 0.3, 0);
      c.closePath();
      break;
    }
    case 'shield':
      c.moveTo(-r, -r);
      c.lineTo(r, -r);
      c.lineTo(r, r * 0.2);
      c.bezierCurveTo(r, r * 0.7, r * 0.5, r, 0, r);
      c.bezierCurveTo(-r * 0.5, r, -r, r * 0.7, -r, r * 0.2);
      c.closePath();
      break;
    case 'sparkle': {
      const pts = 4, outer = r, inner = r * 0.1;
      for (let i = 0; i < pts * 2; i++) {
        const rad = (i & 1) ? inner : outer;
        const ang = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      break;
    }
    case 'circle':
    default:
      c.arc(0, 0, r, 0, Math.PI * 2);
      break;
  }
  if (useEvenOdd) c.fill('evenodd'); else c.fill();
  if (outlineW > 0 && r > 2) {
    // 작은 파티클은 외곽선이 뭉개지므로 자동 축소
    const effW = r < 6 ? Math.min(outlineW, 1) : outlineW;
    c.lineWidth = effW;
    c.strokeStyle = 'rgba(0,0,0,0.75)';
    c.lineJoin = 'round';
    c.lineCap = 'round';
    c.stroke();
  }
}

const PX_SCALE = 3; // 레거시 기본값 (pixelScale 파라미터가 우선)

let _paletteCache = null; // 현재 선택된 팔레트 (배열 형태)

function quantizeColor(r, g, b) {
  if (!_paletteCache) return null;
  let bestIdx = 0, bestDist = Infinity;
  for (let i = 0; i < _paletteCache.length; i++) {
    const p = _paletteCache[i];
    const dr = r - p[0], dg = g - p[1], db = b - p[2];
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  return _paletteCache[bestIdx];
}

// =================================================================
//             픽셀 모양 캐시 (성능 최적화)
// =================================================================
// 같은 모양/크기/색을 매 프레임 재래스터화하지 않고 오프스크린 비트맵 재사용
// (makeInsideFn / colorBucket 은 engine.js 에서 제공)
const _shapeCache = new Map();
const SHAPE_CACHE_MAX = 400;

function getCachedPixelShape(shape, halfSrc, scale, r8, g8, b8, withOutline) {
  const R = Math.max(1, Math.round(halfSrc));
  const S = Math.max(1, Math.round(scale));
  const cBucket = colorBucket(r8, g8, b8);
  const key = shape + '|' + R + '|' + S + '|' + cBucket + '|' + (withOutline ? 1 : 0);

  let entry = _shapeCache.get(key);
  if (entry) {
    // LRU: 맨 뒤로 이동
    _shapeCache.delete(key);
    _shapeCache.set(key, entry);
    return entry;
  }

  // 오프스크린에 새로 렌더
  const canvasSize = (R + 2) * 2 * S;
  const off = document.createElement('canvas');
  off.width = canvasSize;
  off.height = canvasSize;
  const offCtx = off.getContext('2d');
  offCtx.translate(canvasSize / 2, canvasSize / 2);
  // 버킷 색으로 양자화해서 그림
  const r2 = (r8 >> 5) << 5;
  const g2 = (g8 >> 5) << 5;
  const b2 = (b8 >> 5) << 5;
  drawPixelShape(offCtx, shape, R, `rgba(${r2},${g2},${b2},1)`, S, withOutline);

  entry = { canvas: off, size: canvasSize };
  _shapeCache.set(key, entry);

  // LRU eviction
  while (_shapeCache.size > SHAPE_CACHE_MAX) {
    const oldest = _shapeCache.keys().next().value;
    _shapeCache.delete(oldest);
  }
  return entry;
}

// 픽셀 래스터 모양 그리기 — 한 논리 픽셀 = scale × scale 실제 픽셀
function drawPixelShape(c, shape, halfSrc, fillStyle, scale, withOutline) {
  const R = Math.max(1, Math.round(halfSrc));
  const isInside = makeInsideFn(shape, R);

  // 내부 채우기 패스
  c.fillStyle = fillStyle;
  c.beginPath();
  for (let y = -R - 1; y <= R + 1; y++) {
    for (let x = -R - 1; x <= R + 1; x++) {
      if (isInside(x, y)) {
        c.rect(x * scale, y * scale, scale, scale);
      }
    }
  }
  c.fill();

  // 외곽선 패스 — 경계 픽셀(내부이면서 이웃이 외부인 칸)에 검정 덮어쓰기
  if (withOutline) {
    c.fillStyle = 'rgba(0,0,0,0.85)';
    c.beginPath();
    for (let y = -R - 1; y <= R + 1; y++) {
      for (let x = -R - 1; x <= R + 1; x++) {
        if (!isInside(x, y)) continue;
        if (!isInside(x - 1, y) || !isInside(x + 1, y) ||
            !isInside(x, y - 1) || !isInside(x, y + 1)) {
          c.rect(x * scale, y * scale, scale, scale);
        }
      }
    }
    c.fill();
  }
}

function drawSystem(sys, cx, cy, c) {
  c = c || ctx;
  const pr = sys.params;
  c.globalCompositeOperation =
    pr.blendMode === 'Additive' ? 'lighter' : 'source-over';

  const shape = pr.particleShape || 'circle';
  const cw = c.canvas.width, ch = c.canvas.height;

  // 픽셀 모드 오프스크린 캐시용 nearest-neighbor 보정
  if (pr.pixelMode) c.imageSmoothingEnabled = false;

  for (const p of sys.particles) {
    const t = p.life / p.maxLife;

    // 크기 이지 곡선 적용
    const sT = sampleCurve(pr.sizeCurve || 'linear', t);
    let size = Math.max(0, lerp(p.startSize, p.endSize, sT));
    if (size <= 0.1) continue;

    const col = sampleColor(pr.colorKeys, t);

    // 수명 시작/끝 소프트 페이드
    let lifeAlpha = 1;
    if (pr.fadeIn > 0 && t < pr.fadeIn) {
      lifeAlpha *= t / pr.fadeIn;
    }
    if (pr.fadeOut > 0 && t > 1 - pr.fadeOut) {
      lifeAlpha *= (1 - t) / pr.fadeOut;
    }
    const alpha = col.a * pr.startColor.a * lifeAlpha;
    if (alpha <= 0.001) continue;

    // 팔레트 양자화
    let r8 = (col.r * 255) | 0;
    let g8 = (col.g * 255) | 0;
    let b8 = (col.b * 255) | 0;
    if (_paletteCache) {
      const snap = quantizeColor(r8, g8, b8);
      r8 = snap[0]; g8 = snap[1]; b8 = snap[2];
    }

    // Stretched billboard
    let rot, sx = 1;
    if (pr.stretch > 0) {
      const vmag = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      rot = Math.atan2(p.vy, p.vx);
      sx = 1 + pr.stretch * Math.min(1, vmag / 800);
    } else {
      rot = p.rotation;
    }

    // 위치 (픽셀 모드는 정수 스냅)
    let px = cx + p.x, py = cy + p.y;
    if (pr.pixelMode) {
      px = Math.round(px);
      py = Math.round(py);
    }

    // ★ 오프스크린 컬링 — 화면 밖 파티클 건너뜀
    const bound = size * Math.max(1, sx) + 4;
    if (px + bound < 0 || px - bound > cw || py + bound < 0 || py - bound > ch) continue;

    // ★ save/restore 대신 setTransform (2~3배 빠름)
    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    c.setTransform(sx * cosR, sx * sinR, -sinR, cosR, px, py);
    c.globalAlpha = alpha;

    if (sprite) {
      c.drawImage(sprite, -size / 2, -size / 2, size, size);
    } else if (pr.pixelMode) {
      // ★ 픽셀 캐시된 비트맵 재사용 (수백 개 rect() → 1 drawImage)
      const MAX_R = 12;
      const baseScale = Math.max(1, pr.pixelScale || 3);
      let halfSrc = size / (2 * baseScale);
      let actualScale = baseScale;
      if (halfSrc > MAX_R) {
        halfSrc = MAX_R;
        actualScale = size / (2 * MAX_R);
      }
      const cached = getCachedPixelShape(
        shape, halfSrc, actualScale, r8, g8, b8, pr.outlineWidth > 0);
      const targetW = (Math.round(halfSrc) + 2) * 2 * actualScale;
      c.drawImage(cached.canvas, -targetW / 2, -targetW / 2, targetW, targetW);
    } else {
      // 솔리드 벡터 모양
      drawShape(c, shape, size / 2, `rgba(${r8},${g8},${b8},1)`, pr.outlineWidth || 0);
    }
  }

  // 변환 리셋
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
}

function drawBackground() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (bgMode === 'checker') {
    // 픽셀 아트 도구 스타일 체커보드
    const tile = 16;
    for (let y = 0; y < canvas.height; y += tile) {
      for (let x = 0; x < canvas.width; x += tile) {
        const c1 = ((x / tile + y / tile) | 0) & 1;
        ctx.fillStyle = c1 ? '#222' : '#1a1a1a';
        ctx.fillRect(x, y, tile, tile);
      }
    }
  } else if (bgMode === 'black') {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function renderAll() {
  drawBackground();

  // 카메라 셰이크 오프셋
  let shakeX = 0, shakeY = 0;
  if (fxShakeT > 0 && fxShakeDurTotal > 0) {
    const falloff = fxShakeT / fxShakeDurTotal;
    shakeX = (Math.random() - 0.5) * 2 * fxShakeMax * falloff;
    shakeY = (Math.random() - 0.5) * 2 * fxShakeMax * falloff;
  }
  const cx = canvas.width / 2 + shakeX;
  const cy = canvas.height / 2 + shakeY;

  // 파티클 렌더
  for (const s of extraSystems) drawSystem(s, cx, cy);
  drawSystem(mainSys, cx, cy);

  // 투사체 본체 렌더
  if (mainSys.params.projectile && mainSys.params.projBodySize > 0 && !mainSys.projDone) {
    const pr = mainSys.params;
    const bx = cx + mainSys.projX, by = cy + mainSys.projY;
    const bodyR = pr.projBodySize / 2;
    const col = pr.colorKeys[0] || { r:1, g:1, b:1, a:1 };
    const r8 = (col.r * 255)|0, g8 = (col.g * 255)|0, b8 = (col.b * 255)|0;

    ctx.save();
    // 발광 효과 (글로우 레이어)
    if (pr.projBodyGlow) {
      ctx.globalCompositeOperation = 'lighter';
      const grad = ctx.createRadialGradient(bx, by, bodyR * 0.2, bx, by, bodyR * 2.5);
      grad.addColorStop(0, `rgba(${r8},${g8},${b8},0.6)`);
      grad.addColorStop(0.4, `rgba(${r8},${g8},${b8},0.2)`);
      grad.addColorStop(1, `rgba(${r8},${g8},${b8},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx, by, bodyR * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // 본체
    ctx.globalCompositeOperation = pr.blendMode === 'Additive' ? 'lighter' : 'source-over';
    ctx.globalAlpha = 1;
    ctx.translate(bx, by);
    drawShape(ctx, pr.projBodyShape, bodyR, `rgb(${r8},${g8},${b8})`, 0);
    ctx.restore();
  }

  // 스크린 플래시
  if (fxFlashT > 0 && fxFlashDurTotal > 0) {
    const a = fxFlashMax * (fxFlashT / fxFlashDurTotal);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 그리드 오버레이 (맨 위)
  drawGridOverlay();

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  const total = mainSys.particles.length +
    extraSystems.reduce((a, s) => a + s.particles.length, 0);
  const name = currentEffect ? `${currentEffect}  |  ` : '';
  let fps = 60;
  if (frameHistory.length > 10) {
    const span = frameHistory[frameHistory.length - 1] - frameHistory[0];
    fps = Math.round((frameHistory.length - 1) * 1000 / span);
  }
  // 캔버스 FPS 오버레이 (항상 보이게)
  const fpsNum = document.getElementById('fps-num');
  const fpsP = document.getElementById('fps-particles');
  if (fpsNum) {
    fpsNum.textContent = fps;
    fpsNum.className = fps >= 55 ? 'good' : fps >= 30 ? 'mid' : 'bad';
  }
  if (fpsP) fpsP.textContent = total;

  document.getElementById('info').textContent =
    `${name}${fps}fps | particles: ${total} | layers: ${1 + extraSystems.length} | t: ${mainSys.systemTime.toFixed(2)}s`;
}


// =================================================================
//                       애니메이션 루프
// =================================================================
function tick(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // FPS 추적 (최근 60프레임 평균)
  frameHistory.push(now);
  if (frameHistory.length > 60) frameHistory.shift();

  if (!recording) {
    // FX 타이머는 실시간으로 감소
    if (fxShakeT > 0) fxShakeT = Math.max(0, fxShakeT - dt);
    if (fxFlashT > 0) fxFlashT = Math.max(0, fxFlashT - dt);

    // 시뮬레이션 dt (hitStop 동안은 거의 정지)
    let simDt = dt;
    if (fxHitStop > 0) {
      fxHitStop -= dt;
      simDt = 0.0005;
    }

    // 한 프레임 스텝 처리 — 일시정지 상태에서도 전진
    const shouldSim = playing || stepping;
    if (stepping) simDt = 1 / 60; // 60fps 기준 1프레임
    stepping = false;

    if (shouldSim) {
      updateSystem(mainSys, simDt);
      for (const s of extraSystems) updateSystem(s, simDt);
      // 착탄 이펙트 시스템 정리 (완료된 것 제거)
      extraSystems = extraSystems.filter(s =>
        !s._isImpact || s.particles.length > 0 || s.systemTime < s.params.duration
      );
    }
    renderAll();
  }
  requestAnimationFrame(tick);
}

function stepFrame() { stepping = true; }
function cycleBg() {
  bgMode = bgMode === 'dark' ? 'checker' : bgMode === 'checker' ? 'black' : 'dark';
}
function toggleGrid() { gridOn = !gridOn; }

function drawGridOverlay() {
  if (!gridOn) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const step = 32;
  for (let x = 0; x < canvas.width; x += step) {
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, canvas.height);
  }
  for (let y = 0; y < canvas.height; y += step) {
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(canvas.width, y + 0.5);
  }
  ctx.stroke();
  // 중앙 십자선
  ctx.strokeStyle = 'rgba(78,161,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2 + 0.5, 0);
  ctx.lineTo(canvas.width / 2 + 0.5, canvas.height);
  ctx.moveTo(0, canvas.height / 2 + 0.5);
  ctx.lineTo(canvas.width, canvas.height / 2 + 0.5);
  ctx.stroke();
}

function copyParamsJson() {
  const data = JSON.stringify(mainSys.params, null, 2);
  navigator.clipboard.writeText(data).then(() => {
    showFlash('✓ 파라미터를 클립보드에 복사했습니다');

function showFlash(msg) {

    el.id = 'copy-flash';
    el.className = 'copy-flash';
    document.body.appendChild(el);

}

}

    const pal = PALETTES[currentPaletteName];

    preview.innerHTML = '';
    for (const c of pal) {

function bindPresetSearch() {

  inp.oninput = () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const q = inp.value.toLowerCase().trim();
      document.querySelectorAll('.preset-grid button').forEach(btn => {
        btn.style.display = !q || btn.textContent.toLowerCase().includes(q) ? '' : 'none';

      });

  };
}
requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(tick); });

function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '■ 정지' : '▶ 재생';
  if (playing && mainSys.particles.length === 0) restart();
}
function resetSys(s) {
  s.particles = [];
  s.systemTime = 0;
  s.emitAccum = 0;
  s.burstDone = false;
  s.burstEmitted = 0;
  s.projX = 0;
  s.projY = 0;
  s.projT = 0;
  s.projDone = false;
}
function restart() {
  resetSys(mainSys);
  for (const s of extraSystems) resetSys(s);
  triggerFX();
}

function updateProjVisibility() {
  const isProj = !!params.projectile;
  const path = params.projPath;
  const hasBody = params.projBodySize > 0;
  document.querySelectorAll('[data-proj-dep]').forEach(row => {
    const dep = row.dataset.projDep;
    let show = false;
    if (dep === 'proj') show = isProj;
    else if (dep === 'arc') show = isProj && path === 'arc';
    else if (dep === 'wave') show = isProj && path === 'wave';
    else if (dep === 'body') show = isProj && hasBody;
    row.style.display = show ? '' : 'none';
  });
}

function buildParamPanel() {
  const panel = document.getElementById('param-panel');
  panel.innerHTML = '';
  for (const g of paramDefs) {
    const h = document.createElement('h3');
    h.className = 'group-header';
    h.textContent = g.group;
    const content = document.createElement('div');
    content.className = 'group-content';
    if (collapsedGroups.has(g.group)) {
      h.classList.add('collapsed');
      content.style.display = 'none';
    }
    h.onclick = () => {
      const isC = h.classList.toggle('collapsed');
      content.style.display = isC ? 'none' : '';
      if (isC) collapsedGroups.add(g.group);
      else collapsedGroups.delete(g.group);
    };
    panel.appendChild(h);
    panel.appendChild(content);
    for (const it of g.items) {
      const [name, type] = it;
      const row = document.createElement('div'); row.className = 'row';
      const lbl = document.createElement('label'); lbl.textContent = name;
      row.appendChild(lbl);

      // 투사체 조건부 표시: 관련 파라미터에 의존성 표시
      const PROJ_DEPS = {
        projSpeed:'proj', projDistance:'proj', projAngle:'proj', projPath:'proj',
        projArcHeight:'arc', projWaveAmp:'wave', projWaveFreq:'wave',
        projBodySize:'proj', projBodyShape:'body', projBodyGlow:'body',
        projImpact:'proj',
      };
      if (PROJ_DEPS[name]) row.dataset.projDep = PROJ_DEPS[name];

      if (type === 'num') {
        // 슬라이더 + 숫자 박스 (상호 동기화)
        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = it[2]; slider.max = it[3]; slider.step = it[4];
        slider.value = params[name];

        const num = document.createElement('input');
        num.type = 'number';
        num.min = it[2]; num.max = it[3]; num.step = it[4];
        num.value = params[name];
        num.className = 'num-small';

        const sync = v => {
          params[name] = v;
          slider.value = v;
          num.value = v;
        };
        slider.onmousedown = () => pushUndo();
        slider.oninput = () => sync(parseFloat(slider.value) || 0);
        num.onfocus = () => pushUndo();
        num.oninput = () => sync(parseFloat(num.value) || 0);

        row.appendChild(slider);
        row.appendChild(num);
      } else if (type === 'bool') {
        const el = document.createElement('input');
        el.type = 'checkbox';
        el.checked = !!params[name];
        el.onchange = () => { pushUndo(); params[name] = el.checked; updateProjVisibility(); };
        row.appendChild(el);
      } else if (type === 'sel') {
        const el = document.createElement('select');
        const opts = (name === 'projImpact' && typeof PRESETS !== 'undefined')
          ? ['none', ...Object.keys(PRESETS)]
          : it[2];
        for (const opt of opts) {
          const o = document.createElement('option');
          o.value = opt; o.textContent = opt;
          el.appendChild(o);
        }
        el.value = params[name];
        el.onchange = () => { pushUndo(); params[name] = el.value; updateProjVisibility(); };
        row.appendChild(el);
      }
      // 숫자 슬라이더 변경 시에도 조건부 표시 갱신 (projBodySize 등)
      if (name === 'projBodySize') {
        const origSync = row.querySelector('input[type=range]');
        if (origSync) {
          const origOninput = origSync.oninput;
          origSync.oninput = function() { origOninput.call(this); updateProjVisibility(); };
        }
        const origNum = row.querySelector('input[type=number]');
        if (origNum) {
          const origOninput2 = origNum.oninput;
          origNum.oninput = function() { origOninput2.call(this); updateProjVisibility(); };
        }
      }
      content.appendChild(row);
    }
  }

  updateProjVisibility();

  // 색 키 섹션 (접힘 가능)
  const h = document.createElement('h3');
  h.className = 'group-header';
  h.textContent = 'Color Over Lifetime';
  const colContent = document.createElement('div');
  colContent.className = 'group-content';
  if (collapsedGroups.has('Color Over Lifetime')) {
    h.classList.add('collapsed');
    colContent.style.display = 'none';

  h.onclick = () => {
    const isC = h.classList.toggle('collapsed');
    colContent.style.display = isC ? 'none' : '';

    else collapsedGroups.delete('Color Over Lifetime');

  panel.appendChild(h);
  panel.appendChild(colContent);
  const keyWrap = document.createElement('div');
  keyWrap.id = 'color-keys';
  colContent.appendChild(keyWrap);
  rebuildColorKeys();
  const addBtn = document.createElement('button');
  addBtn.textContent = '+ 색 키 추가';
  addBtn.onclick = () => {
    pushUndo();
    params.colorKeys.push({ r:1, g:1, b:1, a:1, t:1 });
    rebuildColorKeys();
  };
  colContent.appendChild(addBtn);
}

function rebuildColorKeys() {
  const wrap = document.getElementById('color-keys');
  wrap.innerHTML = '';
  params.colorKeys.forEach((k, idx) => {
    const row = document.createElement('div');
    row.className = 'color-key';

    const color = document.createElement('input');
    color.type = 'color';
    color.value = rgbToHex(k.r, k.g, k.b);
    color.onfocus = () => pushUndo();
    color.oninput = () => {
      const c = hexToRgb(color.value);
      k.r = c.r; k.g = c.g; k.b = c.b;
    };

    const alpha = document.createElement('input');
    alpha.type = 'number';
    alpha.min = 0; alpha.max = 1; alpha.step = 0.05;
    alpha.value = k.a; alpha.title = 'alpha';
    alpha.onfocus = () => pushUndo();
    alpha.oninput = () => { k.a = parseFloat(alpha.value) || 0; };

    const tIn = document.createElement('input');
    tIn.type = 'number';
    tIn.min = 0; tIn.max = 1; tIn.step = 0.05;
    tIn.value = k.t; tIn.title = 'time (0~1)';
    tIn.onfocus = () => pushUndo();
    tIn.oninput = () => { k.t = parseFloat(tIn.value) || 0; };

    const aLbl = document.createElement('span'); aLbl.textContent = 'α';
    const tLbl = document.createElement('span'); tLbl.textContent = 't';

    const del = document.createElement('button');
    del.textContent = '✕';
    del.onclick = () => {
      pushUndo();
      params.colorKeys.splice(idx, 1);
      rebuildColorKeys();
    };

    row.append(color, aLbl, alpha, tLbl, tIn, del);
    wrap.appendChild(row);
  });
}

function refreshPanel() { buildParamPanel(); }

function rgbToHex(r, g, b) {
  const h = x => Math.max(0, Math.min(255, (x * 255) | 0)).toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255 };
}

function buildPresetList() {
  const list = document.getElementById('preset-list');
  for (const name in PRESETS) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => loadPreset(name);
    list.appendChild(b);
  }
}

function buildComboList() {
  const list = document.getElementById('combo-list');
  if (!list) return;
  for (const name in COMBO_PRESETS) {
    const b = document.createElement('button');
    b.textContent = name;
    b.className = 'combo-btn';
    b.onclick = () => loadCombo(name);
    list.appendChild(b);
  }
}

function loadPreset(name) {
  pushUndo();
  extraSystems = [];
  mainSys.params = defaultParams();
  PRESETS[name](mainSys.params);
  currentEffect = name;
  refreshPanel();
  restart();
  if (!playing) togglePlay();
}

function loadCombo(name) {
  const layers = COMBO_PRESETS[name];
  if (!layers) return;
  pushUndo();
  mainSys.params = defaultParams();
  layers[0](mainSys.params);
  // 나머지 레이어는 추가 시스템
  extraSystems = [];
  for (let i = 1; i < layers.length; i++) {
    const p = defaultParams();
    layers[i](p);
    extraSystems.push(makeSys(p));
  }
  currentEffect = name;
  refreshPanel();
  restart();
  if (!playing) togglePlay();
}

function cloneSys(s) {
  return {
    params: JSON.parse(JSON.stringify(s.params)),
    particles: [],
    systemTime: 0,
    emitAccum: 0,
    burstDone: false,
  };
}

async function exportSpriteSheet() {
  const cols = Math.max(1, parseInt(document.getElementById('sheet-cols').value) || 6);
  const rows = Math.max(1, parseInt(document.getElementById('sheet-rows').value) || 5);
  const cellSize = Math.max(32, parseInt(document.getElementById('sheet-cell').value) || 256);
  const fps = Math.max(1, parseInt(document.getElementById('sheet-fps').value) || 30);
  const total = cols * rows;
  const status = document.getElementById('sheet-status');

  // 독립 녹화 시스템 — 라이브 프리뷰 건드리지 않음
  const recMain = cloneSys(mainSys);
  const recExtras = extraSystems.map(cloneSys);

  // 오프스크린 캔버스
  const recCanvas = document.createElement('canvas');
  recCanvas.width = cellSize;
  recCanvas.height = cellSize;
  const rctx = recCanvas.getContext('2d');

  // 스프라이트 시트 캔버스
  const sheetCanvas = document.createElement('canvas');
  sheetCanvas.width = cols * cellSize;
  sheetCanvas.height = rows * cellSize;
  const sctx = sheetCanvas.getContext('2d');

  const dt = 1 / fps;
  recording = true;
  status.textContent = '녹화 준비...';

  try {
    for (let i = 0; i < total; i++) {
      // 시뮬레이션 진행
      updateSystem(recMain, dt);
      for (const s of recExtras) updateSystem(s, dt);

      // 투명 배경으로 클리어 (중요: 스프라이트 시트는 투명해야 함)
      rctx.clearRect(0, 0, cellSize, cellSize);
      const cx = cellSize / 2;
      const cy = cellSize / 2;

      // 레이어 순서대로 그리기
      for (const s of recExtras) drawSystem(s, cx, cy, rctx);
      drawSystem(recMain, cx, cy, rctx);

      // 시트에 복사
      const col = i % cols;
      const row = Math.floor(i / cols);
      sctx.drawImage(recCanvas, col * cellSize, row * cellSize);

      status.textContent = `녹화 중 ${i + 1}/${total}`;
      if (i % 2 === 0) await new Promise(r => setTimeout(r, 0));
    }

    status.textContent = '저장 중...';

    // 메타데이터
    const meta = {
      cols, rows, cellSize, fps,
      frameCount: total,
      duration: total / fps,
      sheetWidth: sheetCanvas.width,
      sheetHeight: sheetCanvas.height,
      params: recMain.params,
      extraLayers: recExtras.map(s => s.params),
    };

    sheetCanvas.toBlob(blob => {
      // PNG 다운로드
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `particle_sheet_${cols}x${rows}.png`;
      a.click();
      URL.revokeObjectURL(url);

      // JSON 메타 다운로드
      const metaBlob = new Blob([JSON.stringify(meta, null, 2)], { type: 'application/json' });
      const murl = URL.createObjectURL(metaBlob);
      const ma = document.createElement('a');
      ma.href = murl;
      ma.download = `particle_sheet_${cols}x${rows}.json`;
      ma.click();
      URL.revokeObjectURL(murl);

      status.textContent = `✓ ${total}프레임 (${sheetCanvas.width}×${sheetCanvas.height}px) 저장됨`;
      setTimeout(() => { status.textContent = ''; }, 5000);
    }, 'image/png');
  } catch (e) {
    status.textContent = '오류: ' + e.message;
    console.error(e);
  } finally {
    recording = false;
  }
}

document.getElementById('load-input').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      const merged = Object.assign(defaultParams(), obj);
      sanitizeParams(merged);
      pushUndo();
      extraSystems = [];
      mainSys.params = merged;
      refreshPanel();
      restart();
    } catch (err) {
      alert('JSON 파싱 실패: ' + err);
    }
  };
  reader.readAsText(f);
};

document.getElementById('sprite-input').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => { sprite = img; };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
};

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  // 탭 버튼 활성화
  const idx = ['tab-preset','tab-concept','tab-param'].indexOf(tabId);
  if (idx >= 0) document.querySelectorAll('.tab-bar button')[idx].classList.add('active');
  // LLM 키 로드
  if (tabId === 'tab-preset') loadProviderKey();
  // 컨셉 탭 열릴 때 착탄 드롭다운 채우기
  if (tabId === 'tab-concept') initConceptTab();
}

function initConceptTab() {
  const sel = document.getElementById('cpt-impact');
  if (sel && sel.options.length <= 1) {
    sel.innerHTML = '';
    const none = document.createElement('option'); none.value='none'; none.textContent='없음'; sel.appendChild(none);
    for (const name of Object.keys(PRESETS)) {
      const o = document.createElement('option'); o.value=name; o.textContent=name; sel.appendChild(o);
    }
  }
  // 칩 이벤트 바인딩
  document.querySelectorAll('.concept-chips').forEach(group => {
    if (group.dataset.bound) return;
    group.dataset.bound = '1';
    group.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        group.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateConceptProjOpts();
        applyConceptPreset();
      };
    });
  });
  // 슬라이더 ↔ 숫자 동기화 + 즉시 적용
  ['speed','dist','angle','body'].forEach(k => {
    const slider = document.getElementById('cpt-'+k);
    const num = document.getElementById('cpt-'+k+'-num');
    if (slider && num && !slider.dataset.bound) {
      slider.dataset.bound = '1';
      slider.oninput = () => { num.value = slider.value; applyConceptPreset(); };
      num.oninput = () => { slider.value = num.value; applyConceptPreset(); };
    }
  });
  // 착탄 드롭다운 변경 시에도 즉시 적용
  const impSel = document.getElementById('cpt-impact');
  if (impSel && !impSel.dataset.bound) {
    impSel.dataset.bound = '1';
    impSel.onchange = () => { applyConceptPreset(); };
  }
  updateConceptProjOpts();
}

  const role = getConceptVal('concept-role');

  const opts = document.getElementById('concept-proj-opts');
  if (opts) opts.style.display = (role === 'projectile' || movement !== 'stay') ? '' : 'none';

  const ELEM_COLORS = {
